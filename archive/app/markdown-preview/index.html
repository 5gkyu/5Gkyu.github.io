<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Markdown Previewer | Halcyon - 5Gkyu</title>
  <meta name="description" content="ブラウザ上で動作する軽量なMarkdownプレビューツール。GitHub風デザインの切り替え機能付き。">
  
  <link rel="apple-touch-icon" sizes="180x180" href="https://5gkyu.github.io/icon/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="https://5gkyu.github.io/icon/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="https://5gkyu.github.io/icon/favicon-16x16.png">
  <link rel="manifest" href="https://5gkyu.github.io/icon/site.webmanifest">

  <style id="fouc-prevent">body { opacity: 0 !important; visibility: hidden !important; background-color: #FBF6EA !important; }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }</style>

  <!-- GitHub Markdown CSS -->
  <link id="gh-style" rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.2.0/github-markdown.min.css" disabled>

  <style>
    .hl-layout-main { max-width: 100% !important; padding: 0 2rem; }
    .md-app-container {
      width: 100%;
      margin: 0 auto;
      padding: 1rem 0;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
      min-height: calc(100vh - 200px);
    }

    .md-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(106, 86, 74, 0.03);
      padding: 1rem 1.5rem;
      border-radius: 16px;
      border: 1px solid rgba(106, 86, 74, 0.08);
      flex-wrap: wrap;
      gap: 1rem;
    }

    .md-controls-left {
      display: flex;
      gap: 1rem;
      align-items: center;
    }

    .md-file-input-wrapper {
      position: relative;
    }
    
    .md-file-input {
      position: absolute;
      left: 0; top: 0; width: 100%; height: 100%;
      opacity: 0; cursor: pointer;
    }

    .md-layout {
      display: flex;
      gap: 1.5rem;
      flex: 1;
    }

    @media (max-width: 768px) {
      .md-layout { flex-direction: column; }
    }

    .md-pane {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: #ffffff;
      border: 1.5px solid rgba(106, 86, 74, 0.1);
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 4px 15px rgba(106, 86, 74, 0.03);
    }

    .md-pane-header {
      background: rgba(106, 86, 74, 0.05);
      padding: 0.8rem 1.2rem;
      font-weight: 700;
      color: var(--clr-brown);
      border-bottom: 1.5px solid rgba(106, 86, 74, 0.08);
      font-size: 0.95rem;
    }

    .md-textarea {
      flex: 1;
      width: 100%;
      border: none;
      resize: none;
      padding: 1.2rem;
      font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", Menlo, monospace;
      font-size: 0.9rem;
      line-height: 1.6;
      color: var(--clr-brown);
      background: transparent;
      outline: none;
    }

    .md-preview {
      flex: 1;
      padding: 1.5rem;
      overflow-y: auto;
      max-height: 600px;
    }

    /* Halcyon default markdown styling (when github class is NOT applied) */
    .md-preview:not(.markdown-body) {
      color: var(--clr-brown);
      line-height: 1.8;
      font-size: 0.95rem;
    }
    .md-preview:not(.markdown-body) h1, .md-preview:not(.markdown-body) h2, .md-preview:not(.markdown-body) h3 {
      margin-top: 1.5em;
      margin-bottom: 0.5em;
      color: var(--clr-brown);
    }
    .md-preview:not(.markdown-body) h1 { font-size: 1.6rem; border-bottom: 2px solid rgba(106,86,74,0.1); padding-bottom: 0.5rem; }
    .md-preview:not(.markdown-body) h2 { font-size: 1.3rem; border-bottom: 1px dashed rgba(106,86,74,0.2); padding-bottom: 0.3rem; }
    .md-preview:not(.markdown-body) p { margin-bottom: 1rem; }
    .md-preview:not(.markdown-body) a { color: var(--clr-sage); text-decoration: none; }
    .md-preview:not(.markdown-body) a:hover { text-decoration: underline; }
    .md-preview:not(.markdown-body) code {
      background: rgba(106,86,74,0.06);
      padding: 0.2em 0.4em;
      border-radius: 4px;
      font-size: 0.85em;
    }
    .md-preview:not(.markdown-body) pre {
      background: rgba(106,86,74,0.04);
      padding: 1rem;
      border-radius: 8px;
      overflow-x: auto;
      margin-bottom: 1rem;
    }
    .md-preview:not(.markdown-body) pre code { background: transparent; padding: 0; }
    .md-preview:not(.markdown-body) blockquote {
      border-left: 4px solid var(--clr-sage);
      padding-left: 1rem;
      color: rgba(106,86,74,0.7);
      margin-bottom: 1rem;
    }
    .md-preview:not(.markdown-body) ul, .md-preview:not(.markdown-body) ol { padding-left: 1.5rem; margin-bottom: 1rem; }

    /* Custom scrollbar */
    .md-preview::-webkit-scrollbar, .md-textarea::-webkit-scrollbar { width: 8px; height: 8px; }
    .md-preview::-webkit-scrollbar-track, .md-textarea::-webkit-scrollbar-track { background: transparent; }
    .md-preview::-webkit-scrollbar-thumb, .md-textarea::-webkit-scrollbar-thumb { background: rgba(106, 86, 74, 0.2); border-radius: 4px; }
    .md-preview::-webkit-scrollbar-thumb:hover, .md-textarea::-webkit-scrollbar-thumb:hover { background: rgba(106, 86, 74, 0.4); }

    /* Theme Toggle */
    .theme-toggle {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--clr-brown);
    }
    .toggle-switch {
      position: relative;
      width: 44px;
      height: 24px;
      background: rgba(106,86,74,0.2);
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .toggle-switch::after {
      content: '';
      position: absolute;
      top: 2px;
      left: 2px;
      width: 20px;
      height: 20px;
      background: #fff;
      border-radius: 50%;
      transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    .toggle-switch.active { background: #24292e; }
    .toggle-switch.active::after { transform: translateX(20px); }
  </style>
</head>
<body>
  <site-header site-name="App & Tools"></site-header>

  <hl-layout cols="1" class="fluffy-entry delay-1">
    <div class="hl-layout-main">

      <hl-breadcrumb
        level1-name="Archive" level1-url="/archive/"
        level2-name="App & Tools" level2-url="/archive/app/"
        current="Markdown Previewer">
      </hl-breadcrumb>

      <page-title>Markdown Previewer</page-title>

      <div class="md-app-container">
        
        <!-- Controls -->
        <div class="md-controls">
          <div class="md-controls-left">
            <div class="md-file-input-wrapper">
              <button class="hl-btn primary">ファイルを開く (.md)</button>
              <input type="file" id="file-input" class="md-file-input" accept=".md,.txt,text/markdown">
            </div>
            <button class="hl-btn" id="btn-clear">クリア</button>
          </div>
          
          <div class="theme-toggle" id="theme-toggle" role="button" tabindex="0">
            <span>Halcyon</span>
            <div class="toggle-switch" id="toggle-switch"></div>
            <span>GitHub</span>
          </div>
        </div>

        <!-- Editor & Preview -->
        <div class="md-layout">
          <div class="md-pane">
            <div class="md-pane-header">Editor</div>
            <textarea id="editor" class="md-textarea" placeholder="ここにMarkdownを入力、またはファイルを読み込んでください..."></textarea>
          </div>
          <div class="md-pane">
            <div class="md-pane-header">Preview</div>
            <div id="preview" class="md-preview"></div>
          </div>
        </div>

      </div>
    </div>
  </hl-layout>

  <site-footer></site-footer>

  <!-- Components JS -->
  <script src="/components/components.js" type="module"></script>
  <!-- Marked JS -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const editor = document.getElementById('editor');
      const preview = document.getElementById('preview');
      const fileInput = document.getElementById('file-input');
      const btnClear = document.getElementById('btn-clear');
      const themeToggle = document.getElementById('theme-toggle');
      const toggleSwitch = document.getElementById('toggle-switch');
      const ghStyle = document.getElementById('gh-style');

      // Default text
      const defaultMd = `# Markdown Previewer

ようこそ！ここはブラウザで動くMarkdownプレビューアです。

## 機能
- **リアルタイム変換**: 左に書くと右に反映されます
- **デザイン切替**: 右上のスイッチで \`GitHub風\` デザインに切り替え可能
- **ファイル読込**: ローカルの \`.md\` ファイルを読み込めます

> [!NOTE]
> Markdownの記法（太字、リスト、引用など）をすべてサポートしています。

### コード例
\`\`\`javascript
function hello() {
  console.log("Hello, World!");
}
\`\`\`
`;

      // Render function
      const render = () => {
        const mdText = editor.value;
        // Parse with marked
        preview.innerHTML = marked.parse(mdText);
      };

      // Initialize
      editor.value = defaultMd;
      render();

      // Events
      editor.addEventListener('input', render);

      btnClear.addEventListener('click', () => {
        editor.value = '';
        render();
        editor.focus();
      });

      fileInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
          editor.value = ev.target.result;
          render();
        };
        reader.readAsText(file);
      });

      // Theme toggle
      let isGithubStyle = false;
      themeToggle.addEventListener('click', () => {
        isGithubStyle = !isGithubStyle;
        toggleSwitch.classList.toggle('active', isGithubStyle);
        
        if (isGithubStyle) {
          preview.classList.add('markdown-body');
          ghStyle.removeAttribute('disabled');
        } else {
          preview.classList.remove('markdown-body');
          ghStyle.setAttribute('disabled', 'true');
        }
      });
      
      // Allow toggle with Enter key
      themeToggle.addEventListener('keydown', (e) => {
        if(e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          themeToggle.click();
        }
      });
    });
  </script>
</body>
</html>
