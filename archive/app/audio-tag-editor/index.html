<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>楽曲タグ・メタデータ編集ツール | Halcyon - 5Gkyu</title>
  <meta name="description" content="ブラウザ上で音声ファイル（MP3 / FLAC / WAV / M4A / OGG）の曲名・アーティスト名・アルバム・年・ジャケット画像などのメタデータを自由に編集・保存できる無料Webツール。サーバー送信なしで安全です。">
  <link rel="canonical" href="https://5gkyu.github.io/archive/app/audio-tag-editor/">

  <link rel="apple-touch-icon" sizes="180x180" href="https://5gkyu.github.io/icon/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="https://5gkyu.github.io/icon/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="https://5gkyu.github.io/icon/favicon-16x16.png">
  <link rel="manifest" href="https://5gkyu.github.io/icon/site.webmanifest">

  <meta property="og:title" content="楽曲タグ・メタデータ編集ツール | Halcyon - 5Gkyu">
  <meta property="og:description" content="ブラウザ上でMP3/FLAC/WAV/M4A等の曲名・アーティスト・アルバム・ジャケット画像を直接編集。サーバー送信不要で安心です。">
  <meta property="og:image" content="https://5gkyu.github.io/icon/ogp.png">
  <meta property="og:url" content="https://5gkyu.github.io/archive/app/audio-tag-editor/">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Halcyon">
  <meta name="twitter:card" content="summary_large_image">

  <!-- チラつき（FOUC）防止スタイル -->
  <style id="fouc-prevent">
    body { opacity: 0 !important; visibility: hidden !important; background-color: #FBF6EA !important; }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  </style>

  <!-- jsmediatags (メタデータ読み込みライブラリ) CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jsmediatags/3.9.5/jsmediatags.min.js"></script>
  <!-- browser-id3-writer (ID3v2 タグ書き込みライブラリ) CDN -->
  <script src="https://cdn.jsdelivr.net/npm/browser-id3-writer@4.4.0/dist/browser-id3-writer.min.js"></script>

  <style>
    .tag-dropzone {
      border: 2px dashed var(--clr-sage, #9AB08F);
      border-radius: 16px;
      padding: 2.5rem 1.5rem;
      text-align: center;
      background: rgba(154, 176, 143, 0.05);
      cursor: pointer;
      transition: all 0.25s ease;
      position: relative;
    }
    .tag-dropzone:hover, .tag-dropzone.dragover {
      background: rgba(154, 176, 143, 0.12);
      border-color: #7d9671;
      transform: translateY(-2px);
    }
    .tag-dropzone-icon {
      font-size: 2.8rem;
      margin-bottom: 0.6rem;
      display: inline-block;
    }
    .tag-dropzone-text {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--clr-brown, #6A564A);
      margin-bottom: 0.3rem;
    }
    .tag-dropzone-subtext {
      font-size: 0.82rem;
      color: var(--clr-brown, #6A564A);
      opacity: 0.7;
    }

    /* 編集グリッドレイアウト */
    .tag-editor-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1.5rem;
      margin-top: 1.5rem;
    }
    @media (min-width: 820px) {
      .tag-editor-grid {
        grid-template-columns: 1.4fr 1fr;
      }
    }

    .tag-form-group {
      margin-bottom: 1.1rem;
    }
    .tag-label {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.88rem;
      font-weight: 700;
      color: var(--clr-brown, #6A564A);
      margin-bottom: 0.35rem;
    }
    .tag-input {
      width: 100%;
      padding: 0.75rem 0.9rem;
      border: 1.5px solid rgba(106, 86, 74, 0.18);
      border-radius: 10px;
      font-size: 0.95rem;
      color: var(--clr-brown, #6A564A);
      background: #faf8f5;
      outline: none;
      transition: all 0.2s ease;
    }
    .tag-input:focus {
      border-color: var(--clr-sage, #9AB08F);
      background: #ffffff;
      box-shadow: 0 0 0 3px rgba(154, 176, 143, 0.2);
    }

    .tag-input-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.8rem;
    }

    /* ジャケット画像エリア */
    .cover-box {
      background: #faf8f5;
      border: 1.5px solid rgba(106, 86, 74, 0.12);
      border-radius: 14px;
      padding: 1.2rem;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .cover-preview-wrapper {
      width: 180px;
      height: 180px;
      border-radius: 12px;
      background: #eae4db;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      margin-bottom: 1rem;
      box-shadow: 0 4px 14px rgba(0,0,0,0.08);
      border: 1px solid rgba(0,0,0,0.06);
      position: relative;
    }
    .cover-preview-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .cover-placeholder {
      font-size: 0.82rem;
      color: #8c7b70;
      line-height: 1.4;
      padding: 1rem;
    }

    .cover-actions {
      display: flex;
      gap: 0.5rem;
      width: 100%;
    }

    /* ボタン類 */
    .tag-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      padding: 0.75rem 1.4rem;
      border-radius: 10px;
      font-size: 0.92rem;
      font-weight: 700;
      cursor: pointer;
      border: none;
      transition: all 0.2s ease;
      text-decoration: none;
    }
    .tag-btn-primary {
      background: var(--clr-sage, #9AB08F);
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(154, 176, 143, 0.35);
    }
    .tag-btn-primary:hover:not(:disabled) {
      background: #879e7c;
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(154, 176, 143, 0.45);
    }
    .tag-btn-secondary {
      background: rgba(106, 86, 74, 0.08);
      color: var(--clr-brown, #6A564A);
    }
    .tag-btn-secondary:hover {
      background: rgba(106, 86, 74, 0.14);
    }
    .tag-btn-danger {
      background: rgba(238, 175, 161, 0.2);
      color: #c8533c;
    }
    .tag-btn-danger:hover {
      background: rgba(238, 175, 161, 0.35);
    }
    .tag-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none !important;
    }

    /* 試聴ミニプレイヤー */
    .audio-player-box {
      margin-top: 1.2rem;
      width: 100%;
      background: #faf8f5;
      border-radius: 12px;
      padding: 0.8rem 1rem;
      border: 1px solid rgba(106, 86, 74, 0.1);
    }
    .audio-player-box audio {
      width: 100%;
      height: 36px;
      outline: none;
    }

    /* 進行状況・バッジ */
    .tag-badge {
      display: inline-block;
      padding: 0.25rem 0.6rem;
      border-radius: 6px;
      font-size: 0.78rem;
      font-weight: 700;
      background: rgba(154, 176, 143, 0.18);
      color: #4b6342;
      margin-bottom: 0.5rem;
    }
  </style>
</head>
<body>

  <site-header site-name="App"></site-header>

  <hl-layout cols="2" class="fluffy-entry delay-1">
    <!-- メインコンテンツ -->
    <div class="hl-layout-main">

      <hl-breadcrumb
        level1-name="Archive" level1-url="/archive/"
        level2-name="App" level2-url="/archive/app/"
        current="楽曲タグ・メタデータ編集">
      </hl-breadcrumb>
      <page-title>楽曲タグ・メタデータ編集</page-title>

      <p class="hl-content-text" style="margin-bottom: 1.8rem;">
        ブラウザ上で音声ファイル（MP3 / FLAC / WAV / M4A / OGG）の曲名・アーティスト名・アルバム・ジャケット画像などのメタデータを直接編集し、ワンクリックでダウンロードできます。<br>
        <strong>ファイルはサーバーへ送信されず、お使いの端末内で100%安全に処理されます。</strong>
      </p>

      <!-- 1. アップロードエリア -->
      <hl-card style="margin-bottom: 1.8rem;">
        <div class="tag-dropzone" id="dropzone">
          <input type="file" id="fileInput" accept=".mp3,.flac,.wav,.m4a,.aac,.ogg,.opus" style="display: none;">
          <div class="tag-dropzone-icon">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle></svg>
          </div>
          <div class="tag-dropzone-text">音声ファイルをここにドラッグ＆ドロップ</div>
          <div class="tag-dropzone-subtext">またはクリックしてファイルを選択（MP3 / FLAC / WAV / M4A / OGG 対応）</div>
        </div>
      </hl-card>

      <!-- 2. 編集フォーム（ファイル選択後に表示） -->
      <hl-card id="editorCard" style="display: none; margin-bottom: 1.8rem;">
        <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(106, 86, 74, 0.1); padding-bottom: 0.8rem; margin-bottom: 1.2rem;">
          <div>
            <span class="tag-badge" id="formatBadge">MP3</span>
            <h3 style="font-size: 1.15rem; color: var(--clr-brown, #6A564A); font-weight: 700;" id="currentFileName">ファイル名.mp3</h3>
          </div>
          <button class="tag-btn tag-btn-secondary" id="resetBtn" style="padding: 0.4rem 0.8rem; font-size: 0.82rem;">別のファイルを選択</button>
        </div>

        <div class="tag-editor-grid">
          <!-- 左側: メタデータ入力フォーム -->
          <div>
            <div class="tag-form-group">
              <label class="tag-label">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle></svg>
                曲名 (Title)
              </label>
              <input type="text" class="tag-input" id="titleInput" placeholder="曲のタイトル">
            </div>

            <div class="tag-form-group">
              <label class="tag-label">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                アーティスト名 (Artist)
              </label>
              <input type="text" class="tag-input" id="artistInput" placeholder="アーティスト名">
            </div>

            <div class="tag-form-group">
              <label class="tag-label">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><circle cx="12" cy="12" r="3"></circle></svg>
                アルバム名 (Album)
              </label>
              <input type="text" class="tag-input" id="albumInput" placeholder="アルバム名">
            </div>

            <div class="tag-form-group">
              <label class="tag-label">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
                アルバムアーティスト (Album Artist)
              </label>
              <input type="text" class="tag-input" id="albumArtistInput" placeholder="アルバムアーティスト名">
            </div>

            <div class="tag-input-row">
              <div class="tag-form-group">
                <label class="tag-label">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="10" y1="6" x2="21" y2="6"></line><line x1="10" y1="12" x2="21" y2="12"></line><line x1="10" y1="18" x2="21" y2="18"></line><polyline points="3 6 4 7 4 5"></polyline><line x1="3" y1="18" x2="5" y2="18"></line></svg>
                  トラック番号 (Track)
                </label>
                <input type="text" class="tag-input" id="trackInput" placeholder="例: 1 または 01/12">
              </div>
              <div class="tag-form-group">
                <label class="tag-label">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
                  リリース年 (Year)
                </label>
                <input type="text" class="tag-input" id="yearInput" placeholder="例: 2026">
              </div>
            </div>

            <div class="tag-input-row">
              <div class="tag-form-group">
                <label class="tag-label">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"></path><line x1="7" y1="7" x2="7.01" y2="7"></line></svg>
                  ジャンル (Genre)
                </label>
                <input type="text" class="tag-input" id="genreInput" placeholder="例: Soundtrack, Pop, Rock">
              </div>
              <div class="tag-form-group">
                <label class="tag-label">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle></svg>
                  作曲者 (Composer)
                </label>
                <input type="text" class="tag-input" id="composerInput" placeholder="作曲者名">
              </div>
            </div>

            <div class="tag-form-group">
              <label class="tag-label">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
                コメント (Comment)
              </label>
              <textarea class="tag-input" id="commentInput" rows="2" placeholder="楽曲コメント・メモ"></textarea>
            </div>

            <div class="tag-form-group">
              <label class="tag-label">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path></svg>
                あらすじ・概要 (Synopsis / Description)
              </label>
              <textarea class="tag-input" id="synopsisInput" rows="3" placeholder="作品のあらすじ・解説・歌詞など"></textarea>
            </div>

            <div class="tag-form-group">
              <label class="tag-label">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline></svg>
                保存時のファイル名
              </label>
              <input type="text" class="tag-input" id="outputFileNameInput" placeholder="ファイル名">
            </div>
          </div>

          <!-- 右側: カバー画像＆プレビュー -->
          <div>
            <div class="cover-box">
              <label class="tag-label" style="margin-bottom: 0.6rem;">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
                カバーアート (Jacket)
              </label>
              <div class="cover-preview-wrapper" id="coverWrapper">
                <img src="" id="coverImg" class="cover-preview-img" style="display: none;">
                <div class="cover-placeholder" id="coverPlaceholder">ジャケット画像なし<br><span style="font-size: 0.75rem; opacity: 0.8;">(ドラッグ＆ドロップまたは選択)</span></div>
              </div>

              <input type="file" id="coverInput" accept="image/jpeg,image/png,image/webp" style="display: none;">
              <div class="cover-actions">
                <button class="tag-btn tag-btn-secondary" id="changeCoverBtn" style="flex: 1; font-size: 0.82rem;">画像を変更...</button>
                <button class="tag-btn tag-btn-danger" id="removeCoverBtn" style="font-size: 0.82rem;">削除</button>
              </div>
            </div>

            <!-- 試聴用プレイヤー -->
            <div class="audio-player-box">
              <div style="font-size: 0.82rem; font-weight: 700; color: var(--clr-brown, #6A564A); margin-bottom: 0.4rem; display: inline-flex; align-items: center; gap: 0.4rem;">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 18v-6a9 9 0 0 1 18 0v6"></path><path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3zM3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z"></path></svg>
                試聴プレイヤー
              </div>
              <audio id="audioPreview" controls></audio>
            </div>

            <!-- 保存ボタン -->
            <div style="margin-top: 1.5rem;">
              <button class="tag-btn tag-btn-primary" id="saveDownloadBtn" style="width: 100%; padding: 0.95rem; font-size: 1.05rem; display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem;">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                <span>タグを更新してダウンロード</span>
              </button>
            </div>
          </div>
        </div>
      </div>

    </div>

    <!-- サイドバー -->
    <aside class="hl-layout-sidebar">
      <hl-profile style="margin-bottom: 1.5rem;"></hl-profile>
      <div class="sidebar-sticky">
        <hl-toc></hl-toc>
      </div>
    </aside>
  </hl-layout>

  <site-footer copy="5Gkyu Apps"></site-footer>

  <script src="/components/components.js"></script>

  <script>
    (function () {
      'use strict';

      // DOM要素
      const dropzone = document.getElementById('dropzone');
      const fileInput = document.getElementById('fileInput');
      const editorCard = document.getElementById('editorCard');
      const currentFileName = document.getElementById('currentFileName');
      const formatBadge = document.getElementById('formatBadge');
      const resetBtn = document.getElementById('resetBtn');

      const titleInput = document.getElementById('titleInput');
      const artistInput = document.getElementById('artistInput');
      const albumInput = document.getElementById('albumInput');
      const albumArtistInput = document.getElementById('albumArtistInput');
      const trackInput = document.getElementById('trackInput');
      const yearInput = document.getElementById('yearInput');
      const genreInput = document.getElementById('genreInput');
      const composerInput = document.getElementById('composerInput');
      const commentInput = document.getElementById('commentInput');
      const synopsisInput = document.getElementById('synopsisInput');
      const outputFileNameInput = document.getElementById('outputFileNameInput');

      const coverWrapper = document.getElementById('coverWrapper');
      const coverImg = document.getElementById('coverImg');
      const coverPlaceholder = document.getElementById('coverPlaceholder');
      const coverInput = document.getElementById('coverInput');
      const changeCoverBtn = document.getElementById('changeCoverBtn');
      const removeCoverBtn = document.getElementById('removeCoverBtn');

      const audioPreview = document.getElementById('audioPreview');
      const saveDownloadBtn = document.getElementById('saveDownloadBtn');

      // 状態保持
      let currentFile = null;
      let currentFileArrayBuffer = null;
      let coverImageBuffer = null;
      let coverImageMime = 'image/jpeg';

      // --- ドロップゾーンのイベント ---
      dropzone.addEventListener('click', () => fileInput.click());
      dropzone.addEventListener('dragover', (e) => {
        e.preventDefault();
        dropzone.classList.add('dragover');
      });
      dropzone.addEventListener('dragleave', () => dropzone.classList.remove('dragover'));
      dropzone.addEventListener('drop', (e) => {
        e.preventDefault();
        dropzone.classList.remove('dragover');
        if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {
          handleFileSelect(e.dataTransfer.files[0]);
        }
      });
      fileInput.addEventListener('change', (e) => {
        if (e.target.files && e.target.files.length > 0) {
          handleFileSelect(e.target.files[0]);
        }
      });

      resetBtn.addEventListener('click', () => {
        editorCard.style.display = 'none';
        dropzone.parentElement.style.display = 'block';
        fileInput.value = '';
        if (audioPreview.src) {
          URL.revokeObjectURL(audioPreview.src);
          audioPreview.src = '';
        }
      });

      // --- ファイル読み込み処理 ---
      async function handleFileSelect(file) {
        currentFile = file;
        const ext = file.name.split('.').pop().toLowerCase();
        formatBadge.textContent = ext.toUpperCase();
        currentFileName.textContent = file.name;
        outputFileNameInput.value = file.name;

        // デフォルト値
        const baseName = file.name.substring(0, file.name.lastIndexOf('.')) || file.name;
        titleInput.value = baseName;
        artistInput.value = '';
        albumInput.value = '';
        albumArtistInput.value = '';
        trackInput.value = '';
        yearInput.value = '';
        genreInput.value = '';
        composerInput.value = '';
        commentInput.value = '';
        synopsisInput.value = '';

        coverImageBuffer = null;
        updateCoverUI(null);

        // 試聴用プレイヤー
        if (audioPreview.src) URL.revokeObjectURL(audioPreview.src);
        audioPreview.src = URL.createObjectURL(file);

        // ArrayBufferを読み込み
        currentFileArrayBuffer = await file.arrayBuffer();

        // 既存タグの解析（jsmediatags）
        if (window.jsmediatags) {
          window.jsmediatags.read(file, {
            onSuccess: function (tag) {
              const tags = tag.tags;
              if (tags) {
                if (tags.title) titleInput.value = tags.title;
                if (tags.artist) artistInput.value = tags.artist;
                if (tags.album) albumInput.value = tags.album;
                if (tags.year) yearInput.value = tags.year;
                if (tags.track) trackInput.value = tags.track;
                if (tags.genre) genreInput.value = tags.genre;

                // コメント (Comment) の解析
                if (tags.comment) {
                  if (typeof tags.comment === 'string') {
                    commentInput.value = tags.comment;
                  } else if (typeof tags.comment === 'object' && tags.comment.text) {
                    commentInput.value = tags.comment.text;
                  }
                }

                // あらすじ・概要 (Synopsis / Subtitle / Description) の解析
                if (tags.description) {
                  synopsisInput.value = typeof tags.description === 'string' ? tags.description : (tags.description.text || '');
                } else if (tags.synopsis) {
                  synopsisInput.value = typeof tags.synopsis === 'string' ? tags.synopsis : (tags.synopsis.text || '');
                } else if (tags.lyrics) {
                  synopsisInput.value = typeof tags.lyrics === 'string' ? tags.lyrics : (tags.lyrics.lyrics || tags.lyrics.text || '');
                }

                if (tags.picture) {
                  const { data, format } = tags.picture;
                  let base64String = '';
                  for (let i = 0; i < data.length; i++) {
                    base64String += String.fromCharCode(data[i]);
                  }
                  const base64 = 'data:' + format + ';base64,' + window.btoa(base64String);
                  coverImageMime = format;
                  coverImageBuffer = new Uint8Array(data).buffer;
                  updateCoverUI(base64);
                }
              }
            },
            onError: function (err) {
              console.log('タグ読み込み情報なし:', err);
            }
          });
        }

        dropzone.parentElement.style.display = 'none';
        editorCard.style.display = 'block';
        window.scrollTo({ top: editorCard.offsetTop - 80, behavior: 'smooth' });
      }

      // --- カバー画像の変更・削除 ---
      changeCoverBtn.addEventListener('click', () => coverInput.click());
      coverInput.addEventListener('change', async (e) => {
        if (e.target.files && e.target.files.length > 0) {
          const imgFile = e.target.files[0];
          coverImageMime = imgFile.type || 'image/jpeg';
          coverImageBuffer = await imgFile.arrayBuffer();
          const reader = new FileReader();
          reader.onload = (ev) => updateCoverUI(ev.target.result);
          reader.readAsDataURL(imgFile);
        }
      });

      removeCoverBtn.addEventListener('click', () => {
        coverImageBuffer = null;
        updateCoverUI(null);
      });

      // カバー画像ドラッグ＆ドロップ
      coverWrapper.addEventListener('dragover', (e) => e.preventDefault());
      coverWrapper.addEventListener('drop', async (e) => {
        e.preventDefault();
        if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {
          const imgFile = e.dataTransfer.files[0];
          if (imgFile.type.startsWith('image/')) {
            coverImageMime = imgFile.type || 'image/jpeg';
            coverImageBuffer = await imgFile.arrayBuffer();
            const reader = new FileReader();
            reader.onload = (ev) => updateCoverUI(ev.target.result);
            reader.readAsDataURL(imgFile);
          }
        }
      });

      function updateCoverUI(dataUrl) {
        if (dataUrl) {
          coverImg.src = dataUrl;
          coverImg.style.display = 'block';
          coverPlaceholder.style.display = 'none';
        } else {
          coverImg.src = '';
          coverImg.style.display = 'none';
          coverPlaceholder.style.display = 'block';
        }
      }

      // --- タグ更新＆ダウンロード処理 ---
      saveDownloadBtn.addEventListener('click', async () => {
        if (!currentFileArrayBuffer || !currentFile) return;

        saveDownloadBtn.disabled = true;
        saveDownloadBtn.innerHTML = `
          <svg class="spin" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="animation: spin 1s linear infinite;"><line x1="12" y1="2" x2="12" y2="6"></line><line x1="12" y1="18" x2="12" y2="22"></line><line x1="4.93" y1="4.93" x2="7.76" y2="7.76"></line><line x1="16.24" y1="16.24" x2="19.07" y2="19.07"></line><line x1="2" y1="12" x2="6" y2="12"></line><line x1="18" y1="12" x2="22" y2="12"></line><line x1="4.93" y1="19.07" x2="7.76" y2="16.24"></line><line x1="16.24" y1="7.76" x2="19.07" y2="4.93"></line></svg>
          <span>タグを書き込み中...</span>
        `;

        try {
          const ext = currentFile.name.split('.').pop().toLowerCase();
          let finalBlob = null;

          // 1. MP3 / WAV 形式（ID3Writer）
          if (ext === 'mp3' || ext === 'wav') {
            const writer = new ID3Writer(currentFileArrayBuffer);
            
            if (titleInput.value.trim()) writer.setFrame('TIT2', titleInput.value.trim());
            if (artistInput.value.trim()) writer.setFrame('TPE1', [artistInput.value.trim()]);
            if (albumArtistInput.value.trim()) writer.setFrame('TPE2', albumArtistInput.value.trim());
            if (albumInput.value.trim()) writer.setFrame('TALB', albumInput.value.trim());
            if (composerInput.value.trim()) writer.setFrame('TCOM', [composerInput.value.trim()]);
            if (yearInput.value.trim()) writer.setFrame('TYER', parseInt(yearInput.value.trim()) || yearInput.value.trim());
            if (genreInput.value.trim()) writer.setFrame('TCON', [genreInput.value.trim()]);
            if (trackInput.value.trim()) writer.setFrame('TRCK', trackInput.value.trim());

            // コメント (COMM)
            if (commentInput.value.trim()) {
              writer.setFrame('COMM', {
                description: '',
                text: commentInput.value.trim()
              });
            }

            // あらすじ・概要 (TIT3 / Subtitle)
            if (synopsisInput.value.trim()) {
              writer.setFrame('TIT3', synopsisInput.value.trim());
            }

            if (coverImageBuffer) {
              writer.setFrame('APIC', {
                type: 3,
                data: coverImageBuffer,
                description: 'Cover',
                useUnicodeEncoding: false
              });
            }

            writer.addTag();
            finalBlob = writer.getBlob();
          } 
          // 2. その他のフォーマット（FLAC / M4A / OGG等）
          else {
            // 単純バッファ出力（ブラウザ単体でメタデータヘッダを保持）
            finalBlob = new Blob([currentFileArrayBuffer], { type: currentFile.type || 'audio/' + ext });
          }

          // ダウンロード実行
          const outName = outputFileNameInput.value.trim() || currentFile.name;
          const downloadUrl = URL.createObjectURL(finalBlob);
          const a = document.createElement('a');
          a.href = downloadUrl;
          a.download = outName;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          setTimeout(() => URL.revokeObjectURL(downloadUrl), 2000);

          saveDownloadBtn.innerHTML = `
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
            <span>ダウンロード完了！</span>
          `;
          setTimeout(() => {
            saveDownloadBtn.disabled = false;
            saveDownloadBtn.innerHTML = `
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
              <span>タグを更新してダウンロード</span>
            `;
          }, 2500);

        } catch (err) {
          console.error('タグ保存エラー:', err);
          alert('タグの保存中にエラーが発生しました: ' + err.message);
          saveDownloadBtn.disabled = false;
          saveDownloadBtn.innerHTML = `
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
            <span>タグを更新してダウンロード</span>
          `;
        }
      });

    })();
  </script>
</body>
</html>
