<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>無料 画像生成AI デモ</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <h1>無料 画像生成AI デモ</h1>
    <p class="desc">APIキー不要（Pollinations）で画像を生成します。</p>

    <form id="genForm" class="panel">
      <label for="prompt">プロンプト</label>
      <textarea id="prompt" rows="4" placeholder="例: cinematic cyberpunk city at night, neon lights, ultra detailed" required></textarea>

      <div class="row">
        <div>
          <label for="width">幅</label>
          <input id="width" type="number" min="256" max="1536" step="64" value="1024" />
        </div>
        <div>
          <label for="height">高さ</label>
          <input id="height" type="number" min="256" max="1536" step="64" value="1024" />
        </div>
        <div>
          <label for="seed">Seed（任意）</label>
          <input id="seed" type="number" min="0" placeholder="空欄でランダム" />
        </div>
      </div>

      <div class="actions">
        <button type="submit">生成する</button>
        <button type="button" id="randomPrompt">サンプルを入れる</button>
      </div>
    </form>

    <section class="panel">
      <div class="status" id="status">待機中</div>
      <div class="previewWrap">
        <iframe id="resultFrame" title="生成結果プレビュー" loading="lazy"></iframe>
      </div>
      <div class="actions">
        <a id="openImage" href="#" target="_blank" rel="noopener noreferrer">生成ページを開く</a>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
