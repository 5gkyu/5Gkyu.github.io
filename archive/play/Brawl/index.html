<!doctype html>
<html lang="ja">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ブロスタ キャラクター評価 | Halcyon - 5Gkyu</title>
  <meta name="description" content="ブロスタ（Brawl Stars）のキャラクター強さ・難易度・おすすめビルドをまとめた評価ページ。" />
  <link rel="canonical" href="https://5gkyu.github.io/Brawl/" />

  <style id="fouc-prevent">
    body {
      opacity: 0 !important;
      visibility: hidden !important;
      background-color: #FBF6EA !important;
    }
  </style>

  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    /* ---- ページ固有変数 ---- */
    :root {
      --brawl-border: rgba(154, 176, 143, 0.25);
      --brawl-surface: #fff;
      --brawl-accent-muted: rgba(154, 176, 143, 0.15);
    }

    /* ---- ステータス行 ---- */
    .brawl-status {
      min-height: 1.2rem;
      margin: 4px 0 12px;
      color: var(--clr-sage);
      font-size: 0.88rem;
      font-family: var(--font-main);
    }

    /* ---- フィルター行 ---- */
    .brawl-filter-row {
      display: block;
      margin-bottom: 10px;
    }

    .brawl-filter-row input,
    .brawl-filter-row select,
    .brawl-filter-row button {
      width: 100%;
      height: 40px;
      padding: 8px 12px;
      border: 1.5px solid var(--brawl-border);
      border-radius: 10px;
      font-size: 0.95rem;
      font-family: var(--font-main);
      background: var(--brawl-surface);
      color: var(--clr-brown);
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
      appearance: auto;
      text-align: left;
      cursor: pointer;
    }

    .brawl-filter-row input:focus,
    .brawl-filter-row select:focus,
    .brawl-filter-row button:focus {
      border-color: var(--clr-sage);
      box-shadow: 0 0 0 3px rgba(154, 176, 143, 0.2);
    }

    /* ---- レアリティモーダル＆ボタン ---- */
    #rarityModalTitle {
      text-align: center;
      font-size: 1.25rem;
      margin-bottom: 20px;
      font-weight: 800;
    }

    .rarity-btn-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 10px;
      margin-top: 8px;
    }

    .rarity-color-btn {
      position: relative;
      width: 100%;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1.5px solid var(--brawl-border);
      background: var(--brawl-surface);
      font-family: var(--font-main);
      font-weight: 700;
      font-size: 0.92rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 10px;
      color: var(--clr-brown);
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.03);
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      overflow: hidden;
    }

    .rarity-color-btn::before {
      content: '';
      display: block;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--rarity-color, #ccc);
      box-shadow: 0 0 6px var(--rarity-color, transparent);
      flex-shrink: 0;
    }

    .rarity-color-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 14px rgba(0, 0, 0, 0.08);
      border-color: var(--rarity-color, var(--clr-sage));
    }

    .rarity-color-btn:active {
      transform: translateY(0);
    }

    .rarity-color-btn.is-selected {
      border-color: var(--rarity-color, var(--clr-sage));
      background: rgba(154, 176, 143, 0.04);
      box-shadow: 0 0 0 1px var(--rarity-color, var(--clr-sage));
    }

    .rarity-color-btn.is-selected::after {
      content: '';
      position: absolute;
      right: 14px;
      width: 6px;
      height: 10px;
      border: solid var(--rarity-color, var(--clr-sage));
      border-width: 0 2.5px 2.5px 0;
      transform: rotate(45deg);
    }

    /* ---- ビューパネル ---- */
    .view-panel {
      min-height: 100px;
    }

    .view-panel[hidden] {
      display: none !important;
    }

    /* ---- テーブル ---- */
    .table-wrap {
      overflow-x: auto;
    }

    .rating-table {
      width: max-content;
      border-collapse: collapse;
      min-width: 0;
      table-layout: auto;
    }

    .rating-table td {
      border: 1px solid var(--brawl-border);
      padding: 1px 2px;
      text-align: left;
      vertical-align: middle;
      font-family: var(--font-main);
    }

    .rating-table tbody tr:nth-child(odd) {
      background: rgba(255, 255, 255, 0.7);
    }

    .rating-table tbody tr:nth-child(even) {
      background: rgba(154, 176, 143, 0.05);
    }

    .rating-table td {
      background: transparent;
    }

    .rating-table tbody tr.is-high-strength td.cell-strength {
      background: rgba(154, 176, 143, 0.15);
    }

    .table-image-wrap {
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 52px;
      height: 52px;
      margin: 0;
      padding: 0;
      line-height: 0;
    }

    .table-char-name {
      position: absolute;
      bottom: 1px;
      left: 0;
      right: 0;
      padding: 11px 2px 2px;
      pointer-events: none;
      line-height: 1;
      background: linear-gradient(to top, rgba(0, 0, 0, 0.46) 0%, rgba(0, 0, 0, 0.08) 64%, transparent 100%);
      font-size: 0.5rem;
      font-weight: 700;
      font-family: var(--font-main);
      color: #fff;
      text-shadow: 0 1px 1px rgba(0, 0, 0, 0.5);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .table-char-image {
      width: 52px;
      height: 52px;
      object-fit: contain;
      display: block;
    }

    .gear-icon-wrap {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 0;
      flex-wrap: nowrap;
      margin: 0;
      padding: 0;
      line-height: 0;
    }

    .table-icon-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 56px;
      height: 56px;
      margin: 0;
      padding: 0;
      line-height: 0;
    }

    .table-gear-icon {
      width: 24px;
      height: 24px;
      object-fit: contain;
      display: block;
    }

    .table-sg-icon {
      width: 54px;
      height: 54px;
      object-fit: contain;
      display: block;
    }

    .rating-table td.cell-image {
      padding: 0;
      line-height: 0;
      width: 52px;
    }

    .rating-table td.cell-image .table-image-wrap {
      cursor: pointer;
    }

    .rating-table td.cell-icon {
      padding: 0 4px;
      line-height: 0;
      width: 54px;
    }

    .rating-table td.cell-gears {
      padding: 0 4px 0 8px;
      line-height: 0;
      min-width: 92px;
    }

    .rating-table td.cell-strength {
      white-space: nowrap;
      padding: 0 0 0 2px;
      width: 52px;
      text-align: left;
    }

    .rating-table td.cell-difficulty {
      padding: 0 4px;
      width: 50px;
      text-align: center;
    }

    .rating-table th {
      padding: 5px 4px;
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--clr-brown);
      background: rgba(154, 176, 143, 0.15);
      border-bottom: 2px solid var(--clr-sage);
      text-align: left;
      white-space: nowrap;
    }

    .rating-table th.sortable-th {
      cursor: pointer;
      user-select: none;
      transition: background 0.15s;
    }

    .rating-table th.sortable-th:hover {
      background: rgba(154, 176, 143, 0.25);
    }

    .sort-indicator {
      display: inline-block;
      width: 10px;
      font-size: 0.65rem;
      color: rgba(106, 86, 74, 0.4);
      margin-left: 2px;
      text-align: center;
    }

    .sortable-th.is-active .sort-indicator {
      color: var(--clr-sage);
      font-weight: 900;
    }



    /* ---- 強さバー ---- */
    .strength-wrap {
      display: inline-flex;
      align-items: center;
    }

    .strength-meter {
      display: inline-flex;
    }

    .strength-bar {
      border-radius: 999px;
      background: rgba(154, 176, 143, 0.3);
    }

    .strength-bar.is-on {
      background: var(--clr-sage);
    }

    .strength-wrap.strength-level-4 .strength-bar.is-on {
      background: #f59e0b;
    }

    .strength-wrap.strength-level-5 .strength-bar.is-on {
      background: #ef4444;
    }

    .strength-value {
      color: var(--clr-brown);
    }

    .strength-wrap.strength-table {
      gap: 2px;
    }

    .strength-wrap.strength-table .strength-meter {
      gap: 2px;
    }

    .strength-wrap.strength-table .strength-bar {
      width: 8px;
      height: 9px;
    }

    .strength-legend-list {
      list-style: none;
      margin: 6px 0 0;
      padding: 0;
      display: grid;
      gap: 6px;
    }

    .strength-legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--clr-brown);
      font-size: 0.9rem;
      font-family: var(--font-main);
    }

    .strength-legend-item .strength-wrap {
      flex-shrink: 0;
    }

    .modal-strength-wrap {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .modal-strength-meter {
      display: inline-flex;
      gap: 4px;
    }

    .modal-strength-dot {
      width: 13px;
      height: 13px;
      box-sizing: border-box;
      border-radius: 999px;
      background: rgba(154, 176, 143, 0.12);
      border: 2px solid rgba(154, 176, 143, 0.55);
    }

    .modal-strength-dot.is-on {
      background: var(--clr-sage);
      border-color: var(--clr-sage);
    }

    .modal-strength-wrap.modal-strength-level-4 .modal-strength-dot.is-on {
      background: #f59e0b;
      border-color: #f59e0b;
    }

    .modal-strength-wrap.modal-strength-level-5 .modal-strength-dot.is-on {
      background: #ef4444;
      border-color: #ef4444;
    }

    .modal-strength-value {
      font-size: 0.96rem;
      font-weight: 700;
      color: var(--clr-brown);
    }

    #modalContent .strength-wrap,
    #modalContent .strength-bar {
      display: none !important;
    }

    /* ---- 難易度バッジ ---- */
    .diff-badge {
      display: inline-block;
      padding: 1px 10px;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 700;
      color: #fff;
    }

    .diff-1 {
      background: #22c55e;
    }

    .diff-2 {
      background: #f59e0b;
    }

    .diff-3 {
      background: #ef4444;
    }

    .modal-diff-inline {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--clr-brown);
    }

    .meta-dim {
      color: rgba(106, 86, 74, 0.4);
    }

    /* ---- アイコン共通 ---- */
    .meta {
      margin: 6px 0;
      font-size: 0.95rem;
      font-family: var(--font-main);
    }

    .icon {
      width: 36px;
      height: 36px;
      object-fit: contain;
      vertical-align: middle;
    }

    .icon-gear {
      width: 36px;
      height: 36px;
    }

    .icon-sg {
      width: auto;
      height: 36px;
      max-width: 58px;
    }

    .modal-icon-row {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .modal-icon-row .gear-icon-wrap {
      display: inline-flex;
      align-items: center;
      justify-content: flex-start;
      gap: 6px;
    }

    .modal-icon-row .table-gear-icon {
      width: 36px;
      height: 36px;
    }

    .modal-mode-row {
      margin-top: 2px;
    }

    .mode-icon-wrap {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .mode-icon {
      width: 38px;
      height: 38px;
      object-fit: contain;
      display: block;
    }

    .gear-chip-wrap {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .gear-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 8px;
      border: 1.5px solid var(--brawl-border);
      border-radius: 999px;
      background: rgba(251, 246, 234, 0.8);
      font-size: 0.9rem;
    }

    .gear-fallback {
      display: inline-block;
      padding: 4px 8px;
      border: 1px dashed var(--brawl-border);
      border-radius: 999px;
      font-size: 0.9rem;
    }

    /* ---- モーダル ---- */
    .modal {
      position: fixed;
      inset: 0;
      z-index: 500;
    }

    .modal-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(74, 59, 50, 0.55);
      backdrop-filter: blur(4px);
    }

    .modal-body {
      position: relative;
      width: min(560px, 92vw);
      margin: 6vh auto;
      background: var(--clr-cream);
      border-radius: 20px;
      padding: 0 0 16px;
      max-height: 88vh;
      overflow-y: auto;
      overflow-x: hidden;
      box-shadow: 0 16px 48px rgba(106, 86, 74, 0.2);
    }

    .modal-close {
      position: absolute;
      top: 10px;
      right: 10px;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      font-size: 1.2rem;
      line-height: 1;
      padding: 0;
      z-index: 2;
      background: rgba(106, 86, 74, 0.15);
      color: var(--clr-brown);
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0;
      box-shadow: none;
      transition: background 0.15s;
    }

    .modal-close:hover {
      background: rgba(238, 175, 161, 0.3);
      transform: none;
      box-shadow: none;
    }

    .modal-banner {
      width: 100%;
      height: 260px;
      max-height: none;
      object-fit: cover;
      display: block;
      border-radius: 20px 20px 0 0;
    }

    .modal-section {
      text-align: center;
    }

    .modal-main-image {
      width: min(220px, 80vw);
      height: min(220px, 80vw);
      object-fit: contain;
      display: block;
      margin: 0 auto 8px;
    }

    #modalTitle {
      padding: 0 16px;
      margin: 12px 0 4px;
      font-size: 1.2rem;
      font-family: var(--font-main);
      color: var(--clr-brown);
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .modal-date-badge {
      font-size: 0.72rem;
      font-weight: 600;
      color: rgba(106, 86, 74, 0.65);
      background: rgba(154, 176, 143, 0.18);
      border: 1.5px solid rgba(154, 176, 143, 0.4);
      border-radius: 999px;
      padding: 2px 9px;
      white-space: nowrap;
    }

    #modalContent {
      padding: 0 16px;
    }

    .modal-noimage {
      display: grid;
      place-items: center;
      border: 1px dashed var(--brawl-border);
      border-radius: 8px;
      color: rgba(106, 86, 74, 0.5);
    }

    .modal-meta-title {
      margin: 10px 0 4px;
      font-size: 0.88rem;
      color: rgba(106, 86, 74, 0.7);
      font-weight: 700;
      font-family: var(--font-main);
    }

    .modal-com {
      background: rgba(154, 176, 143, 0.1);
      border-radius: 10px;
      padding: 10px 12px;
      margin: 8px 0;
      border-left: 3px solid var(--clr-sage);
    }

    .modal-com p {
      margin: 0;
      font-size: 0.92rem;
      line-height: 1.6;
      color: var(--clr-brown);
      font-family: var(--font-main);
    }

    .guide-link {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-top: 12px;
      padding: 9px 14px;
      background: var(--clr-cream);
      border: 1.5px solid var(--clr-sage);
      border-radius: 10px;
      color: var(--clr-brown);
      font-size: 0.85rem;
      font-weight: 700;
      text-decoration: none;
      font-family: var(--font-main);
      transition: background 0.15s;
    }

    .guide-link:hover {
      background: rgba(154, 176, 143, 0.2);
    }

    .modal-skin-reason {
      font-size: 0.9rem;
      color: rgba(106, 86, 74, 0.75);
      margin: 4px 0 0;
      line-height: 1.5;
      font-family: var(--font-main);
    }

    .modal-tag-row {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      margin: 8px 0 4px;
    }

    .modal-role-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 0.82rem;
      font-weight: 700;
      color: #fff;
      line-height: 1.4;
      font-family: var(--font-main);
    }

    .modal-tips {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      background: rgba(154, 176, 143, 0.1);
      border: 1.5px solid rgba(154, 176, 143, 0.3);
      border-radius: 10px;
      padding: 10px 12px;
      margin: 8px 0;
    }

    .modal-tips-icon {
      margin: 0;
      font-size: 1.1rem;
      line-height: 1.4;
      flex-shrink: 0;
    }

    .modal-tips-text {
      margin: 0;
      font-size: 0.9rem;
      line-height: 1.6;
      color: var(--clr-brown);
      font-family: var(--font-main);
    }

    /* ---- 空状態 ---- */
    .empty {
      color: rgba(106, 86, 74, 0.55);
      padding: 14px;
      border: 1px dashed var(--brawl-border);
      border-radius: 12px;
      background: rgba(154, 176, 143, 0.07);
      font-family: var(--font-main);
    }

    /* ---- body ロック ---- */
    body.modal-open,
    body.sheet-open {
      overflow: hidden;
    }

    /* ---- モバイル：テーブルをグリッド表示に切り替え ---- */
    @media (max-width: 768px) {
      .table-wrap {
        overflow-x: hidden;
      }

      .rating-table {
        display: block;
        width: 100%;
        max-width: 100%;
        min-width: 0;
        table-layout: fixed;
        border-collapse: separate;
        border-spacing: 0;
      }

      .rating-table tbody {
        display: block;
        width: 100%;
      }

      .rating-table thead {
        display: block;
        width: 100%;
      }

      .rating-table thead tr {
        display: grid;
        width: 100%;
        grid-template-columns: 40px 40px max-content minmax(0, 1fr);
        column-gap: 2px;
        align-items: center;
        border-bottom: 2px solid var(--clr-sage);
        box-sizing: border-box;
      }

      .rating-table thead th {
        padding: 4px 0;
        font-size: 0.65rem;
        font-weight: 700;
        color: var(--clr-brown);
        text-align: left;
        white-space: nowrap;
      }

      .rating-table thead th.th-build {
        padding-left: 2px;
      }

      .rating-table tbody tr {
        display: grid;
        width: 100%;
        grid-template-columns: 40px 40px max-content 36px 36px minmax(0, 1fr);
        column-gap: 2px;
        align-items: center;
        border-bottom: 1px solid var(--brawl-border);
        box-sizing: border-box;
      }

      .rating-table td,
      .rating-table th {
        padding: 0;
        border: 0;
        background: transparent;
      }

      .table-image-wrap {
        width: 40px;
        height: 40px;
        overflow: hidden;
      }

      .table-char-image {
        width: 40px;
        height: 40px;
        object-fit: cover;
        display: block;
      }

      .table-char-name {
        bottom: 0;
        padding: 9px 2px 2px;
        font-size: 0.46rem;
      }

      .rating-table td.cell-image {
        width: 40px;
      }

      .rating-table td.cell-icon {
        width: 36px;
        min-width: 36px;
        padding: 0 2px;
      }

      .rating-table td.cell-gears {
        width: auto;
        min-width: 0;
        padding-left: 4px;
        overflow: hidden;
      }

      .rating-table td.cell-strength {
        width: 40px;
        min-width: 40px;
        max-width: 40px;
        padding: 0 0 0 1px;
        overflow: hidden;
      }

      .rating-table td.cell-difficulty {
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 0;
      }

      .table-icon-wrap {
        width: 36px;
        height: 36px;
      }

      .table-sg-icon {
        width: 38px;
        height: 38px;
      }

      .table-gear-icon {
        width: 22px;
        height: 22px;
      }

      .rating-table td.cell-gears .gear-icon-wrap {
        justify-content: flex-start;
        flex-wrap: wrap;
      }

      .rating-table .strength-wrap.strength-table {
        gap: 1px;
      }

      .rating-table .strength-wrap.strength-table .strength-meter {
        gap: 1px;
      }

      .rating-table .strength-wrap.strength-table .strength-bar {
        width: 7px;
        height: 6px;
      }

      .simple-item {
        padding: 4px;
      }

      .simple-item-inner {
        padding: 4px;
        gap: 3px;
      }

      .simple-item-img-wrap {
        max-width: 72px;
      }

      .simple-item-name {
        font-size: 0.65rem;
      }

      .modal-body {
        width: 96vw;
        margin: 2vh auto;
        max-height: 94vh;
