<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>バトルアリーナ 観戦シミュレーター | Halcyon - 5Gkyu</title>
    <meta name="description" content="多勢力オートバトル観戦シミュレーター。個性豊かなキャラクターたちが円形闘技場で激突するバトルを観戦しよう。">
    <link rel="stylesheet" href="./css/style.css">
    
    <!-- Three.js & OrbitControls (ローカル同梱版) -->
    <script src="./js/lib/three.min.js"></script>
    <script src="./js/lib/OrbitControls.js"></script>
</head>
<body>
    <!-- 3Dレンダリング用キャンバス領域 -->
    <div id="canvas-container"></div>

    <!-- UIオーバーレイ -->
    <div class="ui-overlay">
        <!-- 上部ヘッダーバー -->
        <header class="header-bar interactive">
            <div class="brand">
                <svg class="brand-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                    <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
                    <polyline points="2 17 12 22 22 17"></polyline>
                    <polyline points="2 12 12 17 22 12"></polyline>
                </svg>
                <span class="brand-title">BATTLE ARENA</span>
                <span class="round-badge">ROUND <span id="round-number">1</span></span>
                <span class="phase-badge phase-betting" id="phase-badge">予想受付中</span>
            </div>

            <!-- ステータス統計 -->
            <div class="header-stats">
                <div class="stat-item">
                    <span class="stat-label">生存総数</span>
                    <span class="stat-value" id="alive-total">--</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">経過時間</span>
                    <span class="stat-value" id="elapsed-time">0.0s</span>
                </div>
            </div>

            <!-- 操作コントロール -->
            <div class="header-controls">
                <!-- 速度選択 -->
                <div class="btn-group">
                    <button class="btn-speed" data-speed="0" title="一時停止">一時停止</button>
                    <button class="btn-speed active" data-speed="1.0" title="等倍速">1x</button>
                    <button class="btn-speed" data-speed="2.0" title="2倍速">2x</button>
                    <button class="btn-speed" data-speed="4.0" title="4倍速">4x</button>
                </div>

                <!-- カメラリセット -->
                <button class="icon-btn" id="btn-reset-cam" title="カメラ視点を初期位置に戻す">
                    <svg viewBox="0 0 24 24">
                        <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
                        <path d="M3 3v5h5"></path>
                    </svg>
                </button>

                <!-- サウンド切り替え -->
                <button class="icon-btn" id="btn-sound-toggle" title="効果音のON/OFF">
                    <svg viewBox="0 0 24 24">
                        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                        <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
                    </svg>
                </button>

                <!-- キャラ図鑑 -->
                <button class="btn-sub-action" id="btn-open-encyclopedia" title="全キャラクターの図鑑・能力を開く">
                    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor">
                        <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
                        <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
                    </svg>
                    <span>キャラ図鑑</span>
                </button>

                <!-- リロール（新マッチ） -->
                <button class="btn-action" id="btn-reroll">新しい対決</button>
            </div>
        </header>

        <!-- 予想フェーズ専用アクションバー -->
        <section class="betting-action-bar interactive" id="betting-action-bar">
            <div class="bet-summary-box">
                <span class="bet-guide-text" id="bet-guide-text">勝利する勢力を選択してください</span>
                <div class="bet-amount-selector" id="bet-amount-selector">
                    <span class="bet-amount-label">賭け金:</span>
                    <button class="btn-amount active" data-amount="100">100</button>
                    <button class="btn-amount" data-amount="250">250</button>
                    <button class="btn-amount" data-amount="500">500</button>
                    <button class="btn-amount" data-amount="ALL">全額</button>
                </div>
            </div>
            <div class="bet-start-wrapper">
                <div class="countdown-text" id="countdown-text"></div>
                <button class="btn-start-battle" id="btn-start-battle">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor">
                        <polygon points="5 3 19 12 5 21 5 3"></polygon>
                    </svg>
                    <span>戦闘開始</span>
                </button>
            </div>
        </section>

        <!-- メイン画面UI（左右分割） -->
        <main class="main-ui-layout">
            <!-- 左側：勢力一覧パネル -->
            <section class="factions-panel interactive" id="factions-container">
                <!-- JSで動的生成 -->
            </section>

            <!-- 右側：戦闘ログ＆オート進行パネル -->
            <section class="right-panel interactive">
                <!-- コイン＆オート進行 -->
                <div class="sub-panel">
                    <div class="panel-header">
                        <span>所持コイン</span>
                        <div class="coin-box">
                            <svg viewBox="0 0 24 24">
                                <circle cx="12" cy="12" r="8"></circle>
                                <line x1="12" y1="8" x2="12" y2="16"></line>
                                <line x1="9" y1="12" x2="15" y2="12"></line>
                            </svg>
                            <span id="player-coins">1000</span>
                        </div>
                    </div>
                    <label class="autoplay-toggle">
                        <input type="checkbox" id="auto-play-checkbox">
                        <span>決着後に自動で次のラウンドへ</span>
                    </label>
                </div>

                <!-- 戦闘実況ログ -->
                <div class="sub-panel">
                    <div class="panel-header">
                        <span>戦闘ログ</span>
                    </div>
                    <div class="combat-log-list" id="combat-log">
                        <!-- JSで動的追加 -->
                    </div>
                </div>
            </section>
        </main>

        <!-- 操作案内ヒント -->
        <footer class="bottom-hints">
            <span>左ドラッグ: 視点回転</span>
            <span>・</span>
            <span>マウスホイール: ズーム</span>
            <span>・</span>
            <span>右ドラッグ: 平行移動</span>
        </footer>
    </div>

    <!-- ラウンド決着モーダル -->
    <div class="modal-overlay" id="winner-modal">
        <div class="modal-content interactive">
            <div class="winner-banner">
                <h2 class="winner-title" id="winner-title">-- の勝利！</h2>
                <p class="winner-subtitle" id="winner-subtitle">決着タイム: 0.0s</p>
            </div>

            <!-- MVPランキング -->
            <div id="winner-stats"></div>

            <div class="modal-actions">
                <button class="btn-action btn-large" id="btn-next-round">次のラウンドへ</button>
            </div>
        </div>
    </div>

    <!-- 全画面キャラクター図鑑 (全画面ビュー) -->
    <div class="encyclopedia-fullscreen" id="encyclopedia-fullscreen">
        <!-- 上部ヘッダーバー (タイトル ＆ ×閉じるボタン) -->
        <header class="encyclopedia-topbar">
            <div class="encyclopedia-brand">
                <svg viewBox="0 0 24 24" class="encyclopedia-icon" fill="none" stroke="currentColor">
                    <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
                    <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
                </svg>
                <div class="encyclopedia-title-text">
                    <h1>キャラクター大図鑑</h1>
                    <span class="encyclopedia-subtitle">全23勢力の確定ステータス・固有能力数値・相性ガイド</span>
                </div>
            </div>
            <button class="btn-close-fullscreen" id="btn-close-encyclopedia" title="バトル画面に戻る (Esc)">
                <svg viewBox="0 0 24 24">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
                <span>閉じる</span>
            </button>
        </header>

        <!-- メインエリア：アイコンセレクター ＋ 特大詳細パネル -->
        <main class="encyclopedia-main">
            <!-- 勢力カテゴリフィルタタブ -->
            <div class="ency-category-tabs" id="ency-category-tabs">
                <button class="btn-ency-tab active" data-category="all">すべて (23)</button>
                <button class="btn-ency-tab" data-category="basic">基本 (8)</button>
                <button class="btn-ency-tab" data-category="swarm">大群系 (3)</button>
                <button class="btn-ency-tab" data-category="elite">少数精鋭系 (4)</button>
                <button class="btn-ency-tab" data-category="gimmick">ギミック系 (8)</button>
            </div>

            <!-- 全23勢力アイコンカード一覧 -->
            <section class="encyclopedia-icon-grid" id="encyclopedia-icon-grid">
                <!-- JSで動的生成 -->
            </section>

            <!-- 選択されたキャラクターの詳細ビュー (1画面収束・3カラムレイアウト) -->
            <section class="encyclopedia-detail-view" id="encyclopedia-detail-view">
                <!-- カラム1：ヒーロー情報＆基礎ステータス＆プロフィール -->
                <div class="ency-col-status" id="ency-col-status"></div>

                <!-- カラム2：固有能力 精密仕様書 ＆ 計算式 ＆ 戦術解説 -->
                <div class="ency-col-ability" id="ency-col-ability"></div>

                <!-- カラム3：実戦アクションプレビュー LIVE DEMO -->
                <div class="ency-col-preview">
                    <div class="ency-preview-container">
                        <div class="ency-preview-header">
                            <div class="ency-preview-title">
                                <svg viewBox="0 0 24 24" width="15" height="15" fill="currentColor">
                                    <polygon points="5 3 19 12 5 21 5 3"></polygon>
                                </svg>
                                <span>実戦アクションプレビュー</span>
                                <span class="ency-preview-badge">LIVE DEMO</span>
                            </div>
                            <div class="ency-preview-controls">
                                <button class="btn-preview-ctl" id="btn-preview-replay" title="最初から再生">
                                    <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.5">
                                        <path d="M1 4v6h6M23 20v-6h-6"></path>
                                        <path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 0 1 3.51 15"></path>
                                    </svg>
                                    <span>リプレイ</span>
                                </button>
                                <button class="btn-preview-ctl" id="btn-preview-toggle" title="一時停止/再生">
                                    <span id="preview-toggle-text">一時停止</span>
                                </button>
                            </div>
                        </div>
                        <div class="ency-preview-viewport" id="ency-preview-viewport">
                            <!-- Three.js プレビューキャンバスが自動挿入される -->
                            <div class="ency-preview-caption" id="ency-preview-caption">戦闘準備中...</div>
                        </div>
                        <div class="ency-preview-footer">
                            <span>※画面ドラッグで3Dカメラ回転可能</span>
                            <span>・</span>
                            <span>自動ループ再生中</span>
                        </div>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <!-- アプリケーションエントリーポイント -->
    <script type="module" src="./js/app.js?v=20260930_4"></script>
</body>
</html>
