  <!-- JS読み込み前の画面隠蔽（チラつき防止） -->
  <style id="fouc-prevent">
    body {
      opacity: 0 !important;
      visibility: hidden !important;
      background-color: #FBF6EA !important;
    }
  </style>

  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    /* ヒーロー画像（フルブリード） */
    .hero-img-section {
      width: 100%;
      max-width: 1400px;
      margin: 0 auto;
      padding: 100px 2rem 2rem; /* ヘッダー高さを考慮した余白 */
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 2rem;
      align-items: start;
      position: relative;
      isolation: isolate; /* 背景用疑似要素のz-index管理のため */
    }

    /* 動画のサムネイルを背景にしてぼかす（アンビエントモード） */
    .hero-img-section::before {
      content: '';
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%) scale(1.05);
      width: 100vw;
      height: 100%;
      background-image: var(--hero-bg, linear-gradient(135deg, #1e1e1e, #3a3a3a));
      background-size: cover;
      background-position: center;
      filter: blur(25px) saturate(130%) brightness(0.85);
      opacity: 0.8;
      z-index: -1;
      transition: background-image 0.5s ease;
    }

    .hero-video-wrapper {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background-color: #000;
      border-radius: 12px;
      overflow: hidden;
      pointer-events: auto; /* クリックを有効化 */
      box-shadow: 0 10px 30px rgba(106, 86, 74, 0.15);
    }

    .hero-video-wrapper iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    /* プラットフォーム切り替えタブ */
    .platform-tabs {
      display: flex;
      gap: 0.8rem;
      margin-top: 1rem;
    }
    .platform-tab {
      background: rgba(40, 40, 40, 0.4);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 0.4rem 1.2rem;
      color: rgba(255, 255, 255, 0.6);
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
    }
    .platform-tab:hover {
      background: rgba(80, 80, 80, 0.5);
      color: #fff;
    }
    .platform-tab.active {
      background: rgba(255, 255, 255, 0.15);
      border-color: rgba(255, 255, 255, 0.4);
      color: #fff;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.2), 0 4px 16px rgba(0, 0, 0, 0.2);
    }

    /* 動画情報パネル */
    .hero-video-info {
      margin-top: 0.6rem;
      background: rgba(40, 40, 40, 0.4);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 12px;
      padding: 0.8rem 1.2rem;
      color: #fff;
      display: flex;
      flex-direction: row;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 0.4s ease, transform 0.4s ease;
      pointer-events: auto;
    }
    .hero-video-info.show {
      opacity: 1;
      transform: translateY(0);
    }
    .hero-video-meta {
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
      overflow: hidden;
      flex: 1;
      min-width: 0;
    }
    .hero-video-author {
      font-size: 0.8rem;
      opacity: 0.8;
      letter-spacing: 0.05em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .hero-video-title {
      font-size: 1.1rem;
      font-weight: 700;
      text-shadow: 1px 1px 4px rgba(0,0,0,0.5);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* イコライザーアニメーション */
    .video-equalizer {
      display: flex;
      align-items: flex-end;
      gap: 4px;
      height: 24px;
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    .video-equalizer.playing {
      opacity: 1;
    }
    .eq-bar {
      width: 4px;
      background-color: #fff;
      border-radius: 2px;
      animation: eq-bounce 1s infinite ease-in-out alternate;
    }
    .eq-bar:nth-child(1) { height: 30%; animation-delay: -0.2s; background-color: #ff6b9d; box-shadow: 0 0 8px rgba(255,107,157,0.8); }
    .eq-bar:nth-child(2) { height: 100%; animation-delay: -0.5s; background-color: #ffa04a; box-shadow: 0 0 8px rgba(255,160,74,0.8); }
    .eq-bar:nth-child(3) { height: 60%; animation-delay: -0.1s; background-color: #ffd700; box-shadow: 0 0 8px rgba(255,215,0,0.8); }
    .eq-bar:nth-child(4) { height: 80%; animation-delay: -0.8s; background-color: #7fff9f; box-shadow: 0 0 8px rgba(127,255,159,0.8); }
    .eq-bar:nth-child(5) { height: 50%; animation-delay: -0.4s; background-color: #4ae8ff; box-shadow: 0 0 8px rgba(74,232,255,0.8); }

    @keyframes eq-bounce {
      0% { transform: scaleY(0.3); transform-origin: bottom; }
      100% { transform: scaleY(1); transform-origin: bottom; }
    }

    /* ------------------------------------------------------------
       トップページ専用コンテンツエリア（右カラム）
    ------------------------------------------------------------ */
    .hero-overlay-content {
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
      pointer-events: auto;
      z-index: 10;
    }

    @media (max-width: 860px) {
      .hero-img-section {
        grid-template-columns: 1fr;
        padding-top: 88px;
        padding-left: 1.5rem;
        padding-right: 1.5rem;
      }
    }

    /* タイトルと説明のガラスパネル */
    .hero-glass-panel {
      pointer-events: auto;
      position: relative;
      background: linear-gradient(135deg,
          rgba(255, 107, 157, 0.22),
          rgba(255, 160, 74, 0.2),
          rgba(255, 220, 80, 0.18),
          rgba(100, 220, 160, 0.18),
          rgba(74, 200, 255, 0.2),
          rgba(167, 139, 250, 0.22));
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: none;
      border-radius: 20px;
      padding: clamp(1.5rem, 3vw, 2.5rem);
      width: 100%;
      max-width: 480px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.18), inset 0 0 0 1px rgba(255, 255, 255, 0.25);
      color: #fff;
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
      text-shadow: 1px 1px 4px rgba(62, 50, 44, 0.5);
      transition: transform 0.3s;
    }

    /* 虹色グラデーション枚線（常時表示） */
    .hero-glass-panel::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 20px;
      padding: 1px;
      background: linear-gradient(135deg, #ff6b9d, #ffa04a, #ffd700, #7fff9f, #4ae8ff, #a78bfa, #ff6b9d);
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      mask-composite: exclude;
      opacity: 0.65;
      pointer-events: none;
    }

    .hero-glass-title {
      font-size: clamp(2.2rem, 4vw, 3.2rem);
      font-weight: 700;
      letter-spacing: 0.05em;
      margin: 0 0 0.5rem 0;
      line-height: 1.1;
      text-shadow: 1px 2px 8px rgba(62, 50, 44, 0.65);
    }

    .hero-glass-subtitle {
      font-size: clamp(0.9rem, 1.5vw, 1.1rem);
      font-weight: 500;
      letter-spacing: 0.08em;
      opacity: 0.95;
    }

    .hero-glass-desc {
      font-size: clamp(0.9rem, 1.5vw, 1rem);
      line-height: 1.8;
      opacity: 0.95;
    }

    /* 最終更新日 */
    .hero-glass-updated {
      font-size: 0.72rem;
      opacity: 0.6;
      text-align: right;
      letter-spacing: 0.05em;
      margin-top: auto;
    }

    /* 詳細ボタン群（ガラスカードスタイル） */
    .hero-nav {
      pointer-events: auto;
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
      width: 100%;
      max-width: 480px;
    }

    .hero-nav-card {
      position: relative;
      display: flex;
      align-items: center;
      gap: 1.2rem;
      text-decoration: none;
      color: #fff;
      background: rgba(40, 40, 40, 0.28);
      border: none;
      border-radius: 16px;
      padding: 1rem 1.2rem;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.18);
      transition: background 0.25s, transform 0.22s, box-shadow 0.3s;
      text-shadow: 1px 1px 4px rgba(62, 50, 44, 0.5);
    }

    /* 虹色グラデーション枚線（常時表示、hoverでアニメ） */
    .hero-nav-card::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 16px;
      padding: 1px;
      background: linear-gradient(90deg, #ff6b9d, #ffa04a, #ffd700, #7fff9f, #4ae8ff, #a78bfa, #ff6b9d);
      background-size: 300% 100%;
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      mask-composite: exclude;
      opacity: 0.7;
      transition: opacity 0.35s;
      animation: rainbow-shift 3s linear infinite paused;
    }

    .hero-nav-card:hover::before {
      opacity: 1;
      animation-play-state: running;
    }

    @keyframes rainbow-shift {
      0% {
        background-position: 0% 50%;
      }

      100% {
        background-position: 300% 50%;
      }
    }

    .hero-nav-card:hover {
      background: rgba(255, 255, 255, 0.18);
      transform: translateY(-3px);
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.22);
    }

    /* Aboutだけ少しアクセントカラー → 他と統一 */
    .hero-nav-card.accent {
      background: rgba(40, 40, 40, 0.28);
      border-color: rgba(255, 255, 255, 0.3);
    }

    .hero-nav-card.accent:hover {
      background: rgba(255, 255, 255, 0.18);
    }

    .nav-card-icon {
      flex-shrink: 0;
      width: 48px;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.3);
    }

    .nav-card-icon svg {
      width: 24px;
      height: 24px;
      fill: #fff;
      filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.3));
    }

    .nav-card-title {
      font-size: 1.2rem;
      font-weight: 700;
      letter-spacing: 0.1em;
    }

    @media (max-width: 768px) {
      .hero-overlay-content {
        align-items: stretch;
      }

      .hero-glass-panel,
      .hero-nav {
        max-width: 100%;
      }

      .hero-glass-panel {
        text-align: center;
        background: linear-gradient(135deg,
            rgba(255, 107, 157, 0.35),
            rgba(255, 160, 74, 0.32),
            rgba(255, 220, 80, 0.28),
            rgba(100, 220, 160, 0.28),
            rgba(74, 200, 255, 0.32),
            rgba(167, 139, 250, 0.35));
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
        border-color: rgba(255, 255, 255, 0.35);
        padding: 2rem 1.5rem;
        text-shadow: 1px 1px 6px rgba(0, 0, 0, 0.6);
      }

      .hero-glass-updated {
        text-align: center;
        font-size: 0.7rem;
        opacity: 0.8;
      }

      .hero-glass-title {
        font-size: 3rem;
      }

      .hero-glass-subtitle {
        font-size: 1.15rem;
      }

      .nav-card-title {
        font-size: 1.3rem;
      }

      .hero-nav-card {
        background: rgba(30, 30, 30, 0.38);
        text-shadow: 1px 1px 4px rgba(62, 50, 44, 0.6);
      }

      /* スマホではアイコンを少し小さく */
      .nav-card-icon {
        width: 40px;
        height: 40px;
      }

      .nav-card-icon svg {
        width: 20px;
        height: 20px;
      }
    }

    /* トップページのみフッター上部マージンをリセット */
    site-footer,
    .site-footer {
      margin-top: 0 !important;
      position: relative;
      z-index: 30;
      /* overlay-contentより前面に配置 */
    }
  </style>
</head>

  <script>
    const nicoList = ["sm46123897", "sm45768473", "sm45354176", "sm45327730", "sm45320107", "sm45263197", "sm44814526", "sm44684885", "sm44674163", "sm44508238", "sm4445918"];
    let currentPlatform = 'niconico';
    var ytPlayer;

    // ニコニコ動画のJS API用メッセージリスナー
    window.addEventListener('message', (event) => {
      if (event.origin !== 'https://embed.nicovideo.jp') return;
      if (event.data.eventName === 'loadComplete') {
        const iframe = document.getElementById('nicoPlayer');
        if (!iframe) return;
        
        iframe.contentWindow.postMessage({
          sourceConnectorType: 1,
          playerId: 'player1',
          eventName: 'mute',
          data: { mute: true }
        }, 'https://embed.nicovideo.jp');
        
        iframe.contentWindow.postMessage({
          sourceConnectorType: 1,
          playerId: 'player1',
          eventName: 'play'
        }, 'https://embed.nicovideo.jp');
      }
    });

    function initYouTube() {
      const wrapper = document.getElementById('hero-video-wrapper');
      wrapper.innerHTML = '<div id="youtube-player"></div>';
      
      ytPlayer = new YT.Player('youtube-player', {
        host: 'https://www.youtube.com',
        playerVars: {
          listType: 'playlist',
          list: 'PL_AxZNiWvR64B0j5pzRn_QVanULhAelZZ',
          autoplay: 1,
          mute: 1,
          loop: 1,
          controls: 1,
          rel: 0
        },
        events: {
          'onReady': function(event) {
            event.target.setShuffle(true);
            event.target.playVideoAt(0);
          },
          'onStateChange': function(event) {
            if (currentPlatform !== 'youtube') return;
            const panel = document.getElementById('video-info-panel');
            const authorEl = document.getElementById('video-info-author');
            const titleEl = document.getElementById('video-info-title');
            const eq = document.getElementById('video-equalizer');
            const heroSection = document.getElementById('hero-section');
            
            if (event.data === YT.PlayerState.PLAYING) {
              const data = event.target.getVideoData();
              if (data && data.title) {
                authorEl.textContent = data.author || '';
                titleEl.textContent = data.title;
                panel.classList.add('show');
                
                if (data.video_id) {
                  heroSection.style.setProperty('--hero-bg', `url('https://img.youtube.com/vi/${data.video_id}/hqdefault.jpg')`);
                }
              }
              if (eq) eq.classList.add('playing');
            } else {
              if (eq) eq.classList.remove('playing');
            }
          }
        }
      });
    }

    function initNiconico() {
      if (ytPlayer && ytPlayer.destroy) {
        ytPlayer.destroy();
      }
      
      const randomId = nicoList[Math.floor(Math.random() * nicoList.length)];
      const wrapper = document.getElementById('hero-video-wrapper');
      
      // ニコニコ動画のiframeを生成 (JS API有効化)
      wrapper.innerHTML = `<iframe id="nicoPlayer" src="https://embed.nicovideo.jp/watch/${randomId}?jsapi=1&playerId=player1" allow="autoplay; encrypted-media" allowfullscreen style="width: 100%; height: 100%; border: none;"></iframe>`;
      
      // 情報パネルをニコニコ仕様に変更
      const panel = document.getElementById('video-info-panel');
      const authorEl = document.getElementById('video-info-author');
      const titleEl = document.getElementById('video-info-title');
      const eq = document.getElementById('video-equalizer');
      const heroSection = document.getElementById('hero-section');
      
      authorEl.textContent = 'ニコニコ動画';
      titleEl.textContent = 'Now Playing (Random)';
      panel.classList.add('show');
      if (eq) eq.classList.remove('playing');
      
      // 背景をデフォルトに戻す
      heroSection.style.removeProperty('--hero-bg');
    }

    function initSoundCloud() {
      if (ytPlayer && ytPlayer.destroy) {
        ytPlayer.destroy();
      }
      
      const wrapper = document.getElementById('hero-video-wrapper');
      
      // SoundCloudのiframeを生成
      wrapper.innerHTML = `<iframe width="100%" height="100%" scrolling="no" frameborder="no" allow="autoplay; encrypted-media" src="https://w.soundcloud.com/player/?url=https%3A//api.soundcloud.com/playlists/soundcloud%253Aplaylists%253A2270724245&color=%23ff5500&auto_play=true&hide_related=false&show_comments=true&show_user=true&show_reposts=false&show_teaser=true&visual=true" style="border:none;"></iframe>`;
      
      // 情報パネルをSoundCloud仕様に変更
      const panel = document.getElementById('video-info-panel');
      const authorEl = document.getElementById('video-info-author');
      const titleEl = document.getElementById('video-info-title');
      const eq = document.getElementById('video-equalizer');
      const heroSection = document.getElementById('hero-section');
      
      authorEl.textContent = 'SoundCloud';
      titleEl.textContent = 'Untitled playlist';
      panel.classList.add('show');
      if (eq) eq.classList.remove('playing');
      
      // 背景をデフォルトに戻す
      heroSection.style.removeProperty('--hero-bg');
    }

    function switchPlatform(platform) {
      if (currentPlatform === platform) return;
      currentPlatform = platform;
      
      document.getElementById('tab-youtube').classList.toggle('active', platform === 'youtube');
      document.getElementById('tab-niconico').classList.toggle('active', platform === 'niconico');
      document.getElementById('tab-soundcloud').classList.toggle('active', platform === 'soundcloud');
      
      const panel = document.getElementById('video-info-panel');
      panel.classList.remove('show');
      
      if (platform === 'youtube') {
        initYouTube();
      } else if (platform === 'niconico') {
        initNiconico();
      } else if (platform === 'soundcloud') {
        initSoundCloud();
      }
    }

    function onYouTubeIframeAPIReady() {
      if (currentPlatform === 'youtube') {
        initYouTube();
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      if (currentPlatform === 'niconico') {
        initNiconico();
      } else if (currentPlatform === 'soundcloud') {
        initSoundCloud();
      }
    });

    // YouTube APIを非同期で読み込む
    var tag = document.createElement('script');
    tag.src = "https://www.youtube.com/iframe_api";
    var firstScriptTag = document.getElementsByTagName('script')[0];
    firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);
  </script>
