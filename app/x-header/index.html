<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Xヘッダー画像メーカー</title>
     <link rel="apple-touch-icon" sizes="180x180" href="https://5gkyu.github.io/icon/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="https://5gkyu.github.io/icon/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="https://5gkyu.github.io/icon/favicon-16x16.png">
<link rel="manifest" href="https://5gkyu.github.io/icon/site.webmanifest">

<meta property="og:title" content="Halcyon">
<meta property="og:description" content="Where the world falls silent, we found our own halcyon days.">
<meta property="og:image" content="https://5gkyu.github.io/icon/ogp.png">
<meta property="og:url" content="https://5gkyu.github.io/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="5gkyu">

<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:site" content="@5gkyu">
<meta name="twitter:title" content="Halcyon">
<meta name="twitter:description" content="Where the world falls silent, we found our own halcyon days.">
<meta name="twitter:image" content="https://5gkyu.github.io/icon/ogp.png">
    <style>
        /* ダブルタップによる拡大を禁止し、ボタン等の操作性を向上 */
        html, body {
            touch-action: manipulation; 
            -webkit-text-size-adjust: 100%;
        }

        body {
            font-family: var(--font-main, sans-serif);
            margin: 0;
            padding: 0;
            background-color: #FBF6EA; /* クリームアイボリー */
            color: #6A564A; /* ウォームブラウン[cite: 1] */
            text-align: center;
        }

        main { padding-top: 100px; padding-bottom: 80px; }

        .container {
            max-width: 900px;
            width: 92%;
            margin: 0 auto;
            background: #fff;
            padding: 30px 15px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(106, 86, 74, 0.1);
        }

        .controls {
            margin-bottom: 25px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }

        .btn {
            padding: 12px 24px;
            border-radius: 9999px;
            font-weight: bold;
            cursor: pointer;
            border: none;
            font-size: 0.9rem;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            user-select: none;
        }

        .upload-btn { background-color: #1da1f2; color: white; }
        .reset-btn { background-color: #EEAFA1; color: white; } /* ピーチ[cite: 1] */

        #sortContainer {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: center;
            margin: 20px 0;
            min-height: 50px;
        }

        .thumb-item {
            width: 80px;
            height: 80px;
            border-radius: 12px;
            position: relative;
            background: #f0f0f0;
            border: 3px solid transparent;
        }

        .thumb-item img { width: 100%; height: 100%; object-fit: cover; border-radius: 9px; }
        .thumb-item.selected { border-color: #9AB08F; transform: scale(1.05); } /* セージ[cite: 1] */

        .delete-btn {
            position: absolute;
            top: -8px;
            right: -8px;
            width: 24px;
            height: 24px;
            background-color: #6A564A;
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            border: 2px solid white;
        }

        /* プレビューエリア */
        .preview-area {
            margin-top: 20px;
            position: relative;
        }

        canvas { display: none; } /* 計算用のため非表示 */

        #resultImage {
            width: 100%;
            height: auto;
            border-radius: 8px;
            border: 1px solid #e1e8ed;
            display: none; /* 画像が生成されるまで非表示 */
        }

        .download-btn {
            display: none;
            margin-top: 25px;
            padding: 15px 40px;
            background-color: #9AB08F; /* セージ[cite: 1] */
            color: white;
            border-radius: 9999px;
            text-decoration: none;
            font-weight: bold;
            border: none;
        }

        .caution-box {
            margin-top: 30px;
            text-align: left;
            background: rgba(146, 181, 188, 0.08); /* ダスティブルー[cite: 1] */
            padding: 20px;
            border-radius: 12px;
            font-size: 0.85rem;
            border-left: 4px solid #92B5BC;
        }
    </style>
</head>
<body>

    <site-header site-name="Header Maker"></site-header>

    <main>
        <div class="container fluffy-entry">
            <h1>Xヘッダー画像メーカー</h1>
            
            <div class="controls">
                <label class="btn upload-btn">
                    <span>📷 写真を追加</span>
                    <input type="file" id="imageInput" accept="image/*" multiple>
                </label>
                <button id="resetBtn" class="btn reset-btn">🗑️ リセット</button>
            </div>

            <div id="sortContainer"></div>

            <div class="preview-area">
                <canvas id="previewCanvas" width="1500" height="500"></canvas>
                <!-- iPad用にCanvasではなくimgタグで結果を表示 -->
                <img id="resultImage" alt="生成されたヘッダー">
            </div>
            
            <button id="saveBtn" class="btn download-btn">画像を保存・展開</button>

            <div class="caution-box">
                <h2>💡 iPad/iPhoneでの保存方法</h2>
                <ul>
                    <li><strong>保存ボタン:</strong> ボタンを押すと画像が全画面で開きます。そこから保存してください。</li>
                    <li><strong>長押し保存:</strong> 上のプレビュー画像を<strong>長押し</strong>して「"写真"に保存」を選択するのが最も確実です。</li>
                    <li><strong>拡大防止:</strong> 画面のダブルタップによる強制拡大を無効化しています。</li>
                </ul>
            </div>
        </div>
    </main>

    <site-footer copy="5Gkyu Apps"></site-footer>

    <script src="https://5gkyu.github.io/components/components.js"></script>
    <script src="https://5gkyu.github.io/components/loading.js"></script>

    <script>
        const imageInput = document.getElementById('imageInput');
        const sortContainer = document.getElementById('sortContainer');
        const canvas = document.getElementById('previewCanvas');
        const resultImage = document.getElementById('resultImage');
        const ctx = canvas.getContext('2d');
        const saveBtn = document.getElementById('saveBtn');
        const resetBtn = document.getElementById('resetBtn');

        let imageObjects = [];
        let selectedId = null;

        // リセット
        resetBtn.addEventListener('click', () => {
            if(confirm("リセットしますか？")) {
                imageObjects = [];
                selectedId = null;
                renderUI();
                resultImage.style.display = 'none';
                saveBtn.style.display = 'none';
            }
        });

        imageInput.addEventListener('change', async (e) => {
            const files = Array.from(e.target.files);
            for (const file of files) {
                if (imageObjects.length >= 10) break;
                const img = await loadImage(file);
                imageObjects.push({ id: Date.now() + Math.random(), img: img });
            }
            renderUI();
            updateCanvas();
            imageInput.value = "";
        });

        function loadImage(file) {
            return new Promise((resolve) => {
                const img = new Image();
                img.onload = () => resolve(img);
                img.src = URL.createObjectURL(file);
            });
        }

        function renderUI() {
            sortContainer.innerHTML = '';
            imageObjects.forEach((obj) => {
                const div = document.createElement('div');
                div.className = `thumb-item ${selectedId === obj.id ? 'selected' : ''}`;
                const img = document.createElement('img');
                img.src = obj.img.src;
                div.appendChild(img);

                const delBtn = document.createElement('div');
                delBtn.className = 'delete-btn';
                delBtn.innerHTML = '×';
                delBtn.onclick = (e) => { e.stopPropagation(); deleteImage(obj.id); };
                div.appendChild(delBtn);

                div.onclick = () => {
                    if (selectedId === null) { selectedId = obj.id; }
                    else if (selectedId === obj.id) { selectedId = null; }
                    else {
                        const idx1 = imageObjects.findIndex(o => o.id === selectedId);
                        const idx2 = imageObjects.findIndex(o => o.id === obj.id);
                        [imageObjects[idx1], imageObjects[idx2]] = [imageObjects[idx2], imageObjects[idx1]];
                        selectedId = null;
                        updateCanvas();
                    }
                    renderUI();
                };
                sortContainer.appendChild(div);
            });
        }

        function deleteImage(id) {
            imageObjects = imageObjects.filter(o => o.id !== id);
            if (selectedId === id) selectedId = null;
            renderUI();
            updateCanvas();
        }

        function updateCanvas() {
            if (imageObjects.length < 1) return;
            const count = imageObjects.length;
            const w = canvas.width / count;
            const h = canvas.height;

            imageObjects.forEach((obj, i) => {
                const img = obj.img;
                const scale = Math.max(w / img.width, h / img.height);
                const sw = w / scale;
                const sh = h / scale;
                const sx = (img.width - sw) / 2;
                const sy = (img.height - sh) / 2;
                ctx.drawImage(img, sx, sy, sw, sh, i * w, 0, w, h);
            });

            // Canvasの内容をimgタグに反映（iPadでの長押し保存用）
            resultImage.src = canvas.toDataURL('image/png');
            resultImage.style.display = 'block';
            
            if (count >= 2) {
                saveBtn.style.display = 'inline-flex';
            }
        }

        // 保存ボタンの動作をiPadに最適化
        saveBtn.addEventListener('click', () => {
            const dataUrl = canvas.toDataURL('image/png');
            // 新しいウィンドウ（タブ）で画像を開く
            const newWindow = window.open();
            newWindow.document.write(`<img src="${dataUrl}" style="width:100%;">`);
            newWindow.document.write('<p style="text-align:center; font-family:sans-serif;">画像を長押しして保存してください</p>');
        });
    </script>
</body>
</html>
