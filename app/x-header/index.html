<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Halcyon 画像コラージュメーカー</title>
    <link rel="apple-touch-icon" sizes="180x180" href="https://5gkyu.github.io/icon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="https://5gkyu.github.io/icon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="https://5gkyu.github.io/icon/favicon-16x16.png">
    <link rel="manifest" href="https://5gkyu.github.io/icon/site.webmanifest">

    <meta property="og:title" content="Halcyon Collage Maker">
    <meta property="og:description" content="Where the world falls silent, we found our own halcyon days.">
    <meta property="og:image" content="https://5gkyu.github.io/icon/ogp.png">
    <meta property="og:url" content="https://5gkyu.github.io/">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="5gkyu">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:site" content="@5gkyu">
    <meta name="twitter:title" content="Halcyon Collage Maker">
    <meta name="twitter:description" content="Where the world falls silent, we found our own halcyon days.">
    <meta name="twitter:image" content="https://5gkyu.github.io/icon/ogp.png">
    <style>
        /* Halcyon Architecture: アニメーションクラスのフォールバック定義 */
        @keyframes fluffyEntry {
            0% { opacity: 0; transform: translateY(20px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        .fluffy-entry { animation: fluffyEntry 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; opacity: 0; }
        .delay-1 { animation-delay: 0.15s; }
        .delay-2 { animation-delay: 0.35s; }
        .delay-3 { animation-delay: 0.55s; }

        html, body {
            touch-action: manipulation; 
            -webkit-text-size-adjust: 100%;
        }

        body {
            font-family: var(--font-main, "Zen Maru Gothic", sans-serif);
            margin: 0;
            padding: 0;
            background-color: #FBF6EA; /* クリームアイボリー */
            color: #6A564A;
            text-align: center;
        }

        main { padding-top: 100px; padding-bottom: 80px; }

        .container {
            max-width: 1000px; /* 2カラム用に少し幅を広げる */
            width: 92%;
            margin: 0 auto;
            background: #fff;
            padding: 30px 20px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(106, 86, 74, 0.1);
            margin-bottom: 20px;
        }

        /* --- 2カラムレイアウト --- */
        .two-column-layout {
            display: flex;
            flex-direction: column;
            gap: 25px;
            margin-top: 20px;
            align-items: stretch;
        }

        .left-col {
            flex: 1.5; /* プレビューエリアを少し広めに */
            min-width: 0;
        }

        .right-col {
            flex: 1;
            min-width: 280px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* PC・タブレット(768px以上)のときのみ横並び */
        @media (min-width: 768px) {
            .two-column-layout {
                flex-direction: row;
                text-align: left; /* PCの時は左揃えの方が見やすい */
            }
            .controls { justify-content: flex-start; }
            #sortContainer { justify-content: flex-start; }
        }

        /* --- 設定パネル --- */
        .settings-panel {
            background: #FBF6EA;
            border-radius: 16px;
            padding: 20px;
            text-align: left;
            display: flex;
            flex-direction: column;
            gap: 18px;
            height: fit-content;
        }

        .setting-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .setting-group label {
            font-size: 0.9rem;
            font-weight: bold;
            color: #9AB08F; /* セージグリーン */
        }

        select, input[type="number"] {
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #dcdcdc;
            font-family: inherit;
            color: #6A564A;
            background: #fff;
            font-size: 0.9rem;
            width: 100%;
            box-sizing: border-box;
        }

        .custom-inputs {
            display: none;
            gap: 10px;
            align-items: center;
            margin-top: 5px;
        }
        .custom-inputs.active { display: flex; }
        .custom-inputs input { width: 100%; }

        /* --- コントロール＆ボタン --- */
        .controls {
            margin-bottom: 15px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }

        .btn {
            padding: 12px 24px;
            border-radius: 9999px;
            font-weight: bold;
            cursor: pointer;
            border: none;
            font-size: 0.9rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            user-select: none;
            transition: opacity 0.2s;
        }
        .btn:hover { opacity: 0.8; }

        .upload-btn { background-color: #9AB08F; color: white; }
        .reset-btn { background-color: #EEAFA1; color: white; }
        .download-btn {
            display: none; /* 初期非表示 */
            padding: 15px 40px;
            background-color: #92B5BC;
            color: white;
            border-radius: 9999px;
            font-weight: bold;
            border: none;
            width: 100%; /* サイドバーに合わせて幅いっぱい */
        }

        /* --- ソート＆サムネイル --- */
        #sortContainer {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: center;
            margin: 15px 0;
            min-height: 50px;
        }

        .thumb-item {
            width: 60px;
            height: 60px;
            border-radius: 12px;
            position: relative;
            background: #f0f0f0;
            border: 3px solid transparent;
            cursor: pointer;
        }

        .thumb-item img { width: 100%; height: 100%; object-fit: cover; border-radius: 9px; }
        .thumb-item.selected { border-color: #EEAFA1; transform: scale(1.05); }

        .delete-btn {
            position: absolute;
            top: -8px;
            right: -8px;
            width: 22px;
            height: 22px;
            background-color: #6A564A;
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            border: 2px solid white;
        }

        /* --- プレビューエリア --- */
        .preview-area {
            position: relative;
            width: 100%;
            background: #faf8f5;
            border-radius: 12px;
            border: 1px dashed #dcdcdc;
            padding: 10px;
            box-sizing: border-box;
            min-height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .preview-area::before {
            content: "プレビュー";
            position: absolute;
            color: #ccc;
            font-weight: bold;
            z-index: 0;
        }

        canvas { display: none; }
        #resultImage {
            width: 100%;
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            border: 1px solid #e1e8ed;
            display: none;
            z-index: 1;
            position: relative;
            background-color: #FBF6EA; /* 透過部分がある場合に白浮きしないように */
        }

        .caution-box {
            margin-top: 30px;
            text-align: left;
            background: rgba(146, 181, 188, 0.08);
            padding: 20px;
            border-radius: 12px;
            font-size: 0.85rem;
            border-left: 4px solid #92B5BC;
        }
    </style>
</head>
<body>

    <site-header site-name="Collage Maker"></site-header>

    <main>
        <div class="container fluffy-entry">
            <h1>Halcyon Collage Maker</h1>
            
            <div class="two-column-layout">
                <div class="left-col fluffy-entry delay-1">
                    <div class="controls">
                        <label class="btn upload-btn">
                            <span>📷 写真を追加</span>
                            <input type="file" id="imageInput" accept="image/*" multiple style="display:none;">
                        </label>
                        <button id="resetBtn" class="btn reset-btn">🗑️ リセット</button>
                    </div>

                    <div id="sortContainer"></div>

                    <div class="preview-area">
                        <canvas id="previewCanvas"></canvas>
                        <img id="resultImage" alt="生成された画像">
                    </div>
                </div>
                
                <div class="right-col fluffy-entry delay-2">
                    <div class="settings-panel">
                        <div class="setting-group">
                            <label>📐 サイズ</label>
                            <select id="sizePreset">
                                <option value="1500,500">X(Twitter) ヘッダー (1500x500)</option>
                                <option value="2560,1440">YouTube アート (2560x1440)</option>
                                <option value="1080,1920">Instagram ストーリーズ (1080x1920)</option>
                                <option value="1080,1080">スクエア / 正方形 (1080x1080)</option>
                                <option value="custom">カスタム指定...</option>
                            </select>
                            <div class="custom-inputs" id="customSizeInputs">
                                <input type="number" id="customW" value="1200" placeholder="幅">
                                <span>x</span>
                                <input type="number" id="customH" value="800" placeholder="高さ">
                            </div>
                        </div>

                        <div class="setting-group">
                            <label>🔲 レイアウト</label>
                            <select id="layoutPreset">
                                <option value="1,auto">横並び（枚数に合わせて自動）</option>
                                <option value="auto,1">縦並び（枚数に合わせて自動）</option>
                                <option value="2,2">2x2 グリッド</option>
                                <option value="3,3">3x3 グリッド</option>
                                <option value="custom">カスタム行列指定...</option>
                            </select>
                            <div class="custom-inputs" id="customGridInputs">
                                <input type="number" id="customRows" value="2" min="1" placeholder="行">
                                <span>行 x</span>
                                <input type="number" id="customCols" value="2" min="1" placeholder="列">
                                <span>列</span>
                            </div>
                        </div>

                        <div class="setting-group">
                            <label>🖼️ 画像の配置方法</label>
                            <select id="fitMode">
                                <option value="cover">中央で切り抜き (Cover)</option>
                                <option value="contain">全体を表示 (Contain)</option>
                                <option value="fill">枠に合わせて引き伸ばす (Fill)</option>
                            </select>
                        </div>
                    </div>
                    
                    <button id="saveBtn" class="btn download-btn">画像を保存・展開</button>
                </div>
            </div>
        </div>

        <div class="container caution-box fluffy-entry delay-3">
            <h2>💡 アプリの使い方</h2>
            <ul>
                <li><strong>設定の即時反映:</strong> カスタムサイズや行列数をキーボードで入力すると、リアルタイムでプレビューが更新されます。</li>
                <li><strong>画像の入れ替え:</strong> 小さいサムネイルを2つ順番にタップすると、場所を入れ替えることができます。</li>
                <li><strong>保存方法:</strong> スマートフォンの場合はプレビュー画像を<strong>長押し</strong>して「写真に保存」を選択、PCの場合は保存ボタンをご利用ください。</li>
            </ul>
        </div>
    </main>

    <site-footer copy="5Gkyu Apps"></site-footer>

    <script src="https://5gkyu.github.io/components/components.js"></script>
    <script src="https://5gkyu.github.io/components/loading.js"></script>

    <script>
        const imageInput = document.getElementById('imageInput');
        const sortContainer = document.getElementById('sortContainer');
        const canvas = document.getElementById('previewCanvas');
        const resultImage = document.getElementById('resultImage');
        const ctx = canvas.getContext('2d');
        const saveBtn = document.getElementById('saveBtn');
        const resetBtn = document.getElementById('resetBtn');

        const sizePreset = document.getElementById('sizePreset');
        const layoutPreset = document.getElementById('layoutPreset');
        const fitMode = document.getElementById('fitMode');
        const customSizeInputs = document.getElementById('customSizeInputs');
        const customGridInputs = document.getElementById('customGridInputs');
        const customW = document.getElementById('customW');
        const customH = document.getElementById('customH');
        const customRows = document.getElementById('customRows');
        const customCols = document.getElementById('customCols');

        let imageObjects = [];
        let selectedId = null;

        // セレクトボックスの変更時は custom 入力欄の出し分けと再描画（changeイベント）
        [sizePreset, layoutPreset, fitMode].forEach(el => {
            el.addEventListener('change', () => {
                customSizeInputs.classList.toggle('active', sizePreset.value === 'custom');
                customGridInputs.classList.toggle('active', layoutPreset.value === 'custom');
                updateCanvas();
            });
        });

        // カスタム数値の入力時は即座に再描画（inputイベント）
        [customW, customH, customRows, customCols].forEach(el => {
            el.addEventListener('input', () => {
                updateCanvas();
            });
        });

        resetBtn.addEventListener('click', () => {
            if(confirm("リセットしますか？")) {
                imageObjects = [];
                selectedId = null;
                renderUI();
                resultImage.style.display = 'none';
                saveBtn.style.display = 'none';
            }
        });

        imageInput.addEventListener('change', async (e) => {
            const files = Array.from(e.target.files);
            for (const file of files) {
                const img = await loadImage(file);
                imageObjects.push({ id: Date.now() + Math.random(), img: img });
            }
            renderUI();
            updateCanvas();
            imageInput.value = "";
        });

        function loadImage(file) {
            return new Promise((resolve) => {
                const img = new Image();
                img.onload = () => resolve(img);
                img.src = URL.createObjectURL(file);
            });
        }

        function renderUI() {
            sortContainer.innerHTML = '';
            imageObjects.forEach((obj) => {
                const div = document.createElement('div');
                div.className = `thumb-item ${selectedId === obj.id ? 'selected' : ''}`;
                const img = document.createElement('img');
                img.src = obj.img.src;
                div.appendChild(img);

                const delBtn = document.createElement('div');
                delBtn.className = 'delete-btn';
                delBtn.innerHTML = '×';
                delBtn.onclick = (e) => { e.stopPropagation(); deleteImage(obj.id); };
                div.appendChild(delBtn);

                div.onclick = () => {
                    if (selectedId === null) { selectedId = obj.id; }
                    else if (selectedId === obj.id) { selectedId = null; }
                    else {
                        const idx1 = imageObjects.findIndex(o => o.id === selectedId);
                        const idx2 = imageObjects.findIndex(o => o.id === obj.id);
                        [imageObjects[idx1], imageObjects[idx2]] = [imageObjects[idx2], imageObjects[idx1]];
                        selectedId = null;
                        updateCanvas();
                    }
                    renderUI();
                };
                sortContainer.appendChild(div);
            });
        }

        function deleteImage(id) {
            imageObjects = imageObjects.filter(o => o.id !== id);
            if (selectedId === id) selectedId = null;
            renderUI();
            updateCanvas();
            if(imageObjects.length === 0) {
                resultImage.style.display = 'none';
                saveBtn.style.display = 'none';
            }
        }

        function updateCanvas() {
            if (imageObjects.length < 1) return;

            let cw, ch;
            if (sizePreset.value === 'custom') {
                cw = parseInt(customW.value) || 1000;
                ch = parseInt(customH.value) || 1000;
            } else {
                [cw, ch] = sizePreset.value.split(',').map(Number);
            }
            canvas.width = cw;
            canvas.height = ch;

            ctx.fillStyle = "#FBF6EA";
            ctx.fillRect(0, 0, cw, ch);

            let rows, cols;
            if (layoutPreset.value === '1,auto') {
                rows = 1; cols = imageObjects.length;
            } else if (layoutPreset.value === 'auto,1') {
                rows = imageObjects.length; cols = 1;
            } else if (layoutPreset.value === 'custom') {
                rows = Math.max(1, parseInt(customRows.value) || 1);
                cols = Math.max(1, parseInt(customCols.value) || 1);
            } else {
                [rows, cols] = layoutPreset.value.split(',').map(Number);
            }

            const cellW = cw / cols;
            const cellH = ch / rows;
            const mode = fitMode.value;

            imageObjects.forEach((obj, i) => {
                if (i >= rows * cols) return;
                
                const r = Math.floor(i / cols);
                const c = i % cols;
                const dx = c * cellW;
                const dy = r * cellH;
                const img = obj.img;

                if (mode === 'fill') {
                    ctx.drawImage(img, dx, dy, cellW, cellH);
                } else {
                    let scale;
                    if (mode === 'cover') {
                        scale = Math.max(cellW / img.width, cellH / img.height);
                    } else {
                        scale = Math.min(cellW / img.width, cellH / img.height);
                    }
                    
                    const sw = cellW / scale;
                    const sh = cellH / scale;
                    const sx = (img.width - sw) / 2;
                    const sy = (img.height - sh) / 2;
                    
                    ctx.save();
                    ctx.beginPath();
                    ctx.rect(dx, dy, cellW, cellH);
                    ctx.clip();
                    ctx.drawImage(img, sx, sy, sw, sh, dx, dy, cellW, cellH);
                    ctx.restore();
                }
            });

            resultImage.src = canvas.toDataURL('image/png');
            resultImage.style.display = 'block';
            
            if (imageObjects.length >= 1) {
                saveBtn.style.display = 'block'; // サイドバーの幅に合わせるため
            }
        }

        saveBtn.addEventListener('click', () => {
            const dataUrl = canvas.toDataURL('image/png');
            const newWindow = window.open();
            newWindow.document.write(`<img src="${dataUrl}" style="width:100%;">`);
            newWindow.document.write('<p style="text-align:center; font-family:sans-serif; margin-top:20px; color:#6A564A;">画像を長押し、または右クリックして保存してください</p>');
        });
    </script>
</body>
</html>
