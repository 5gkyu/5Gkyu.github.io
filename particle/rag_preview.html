<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>ラグトレイン (Lagtrain) - 粒子アニメーション ＆ オルゴール・シンフォニー</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      background-color: #b2b2b2;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
    }
    #canvas-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #b2b2b2;
      z-index: 1;
      cursor: crosshair;
    }
    canvas {
      display: block;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    /* 現代風・統合コントロールパネル */
    .unified-panel {
      position: absolute;
      top: 18px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      width: min(960px, 96vw);
      background: rgba(15, 23, 42, 0.90);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 16px;
      padding: 12px 20px;
      box-shadow: 0 12px 48px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.08);
      display: flex;
      flex-direction: column;
      gap: 10px;
      transition: opacity 0.2s ease, transform 0.2s ease;
    }
    .unified-panel.hidden {
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, -12px);
    }

    /* 1. 最上段: サイト戻るリンク ＆ クレジット表示 ＆ 閉じるボタン */
    .panel-top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .panel-top-left {
      display: flex;
      align-items: center;
      gap: 10px;
      white-space: nowrap;
    }
    .hud-title {
      font-size: 0.76rem;
      font-weight: 800;
      color: #38bdf8;
      letter-spacing: 0.05em;
    }

    /* クレジット表示 */
    .panel-credit-wrap {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 0.74rem;
      color: #94a3b8;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .credit-item {
      color: #cbd5e1;
    }
    .credit-item strong {
      color: #f1f5f9;
      font-weight: 600;
    }
    .credit-sep {
      color: rgba(255, 255, 255, 0.2);
    }

    .btn-panel-close {
      background: transparent;
      border: none;
      color: #94a3b8;
      font-size: 0.78rem;
      cursor: pointer;
      padding: 3px 8px;
      border-radius: 6px;
      line-height: 1;
      transition: all 0.15s ease;
      white-space: nowrap;
    }
    .btn-panel-close:hover {
      background: rgba(255, 255, 255, 0.15);
      color: #ffffff;
    }

    /* 2. 中段: シークバー ＆ フレーム直入力ジャンプ ＆ タイム表示 */
    .timeline-row {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
    }
    .seeker-wrap {
      flex: 1;
      display: flex;
      align-items: center;
    }
    input[type="range"] {
      width: 100%;
      height: 5px;
      border-radius: 3px;
      background: rgba(255, 255, 255, 0.2);
      outline: none;
      -webkit-appearance: none;
      cursor: pointer;
      transition: background 0.15s ease;
    }
    input[type="range"]:hover {
      background: rgba(255, 255, 255, 0.35);
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 13px;
      height: 13px;
      border-radius: 50%;
      background: #8b5cf6;
      border: 2px solid #ffffff;
      box-shadow: 0 0 8px rgba(139, 92, 246, 0.8);
      cursor: pointer;
      transition: transform 0.1s ease;
    }
    input[type="range"]::-webkit-slider-thumb:hover {
      transform: scale(1.25);
    }

    /* フレーム直接入力ボックス */
    .frame-jump-box {
      display: flex;
      align-items: center;
      gap: 4px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 6px;
      padding: 2px 6px;
    }
    .frame-jump-label {
      font-size: 0.72rem;
      font-weight: 700;
      color: #94a3b8;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }
    .frame-input {
      width: 58px;
      background: transparent;
      border: none;
      outline: none;
      color: #38bdf8;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.82rem;
      font-weight: 700;
      text-align: right;
      user-select: text;
    }
    .frame-input::-webkit-inner-spin-button,
    .frame-input::-webkit-outer-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    .frame-max-label {
      font-size: 0.72rem;
      color: #64748b;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    .time-badge {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.78rem;
      font-weight: 700;
      color: #cbd5e1;
      white-space: nowrap;
    }

    /* 3. 下段: 現代風・完全中央配置コントロール (音量 ＆ ツール | -5F -1F [再生SVG] +1F +5F | 座標インスペクター ＆ コピー) */
    .controls-row {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 48px;
      padding-top: 4px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      gap: 10px;
    }

    .left-tools-wrap {
      display: flex;
      align-items: center;
      gap: 6px;
      z-index: 2;
    }

    .vol-wrap {
      display: flex;
      align-items: center;
      gap: 6px;
      width: 90px;
    }
    .vol-label {
      font-size: 0.74rem;
      font-weight: 700;
      color: #94a3b8;
    }

    /* ツールボタンスタイル */
    button.btn-tool {
      background: rgba(255, 255, 255, 0.06);
      color: #94a3b8;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 6px;
      padding: 4px 8px;
      font-size: 0.72rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s ease;
      white-space: nowrap;
    }
    button.btn-tool:hover {
      background: rgba(255, 255, 255, 0.15);
      color: #f8fafc;
    }
    button.btn-tool.active {
      background: rgba(56, 189, 248, 0.22);
      color: #38bdf8;
      border-color: rgba(56, 189, 248, 0.6);
      box-shadow: 0 0 8px rgba(56, 189, 248, 0.3);
    }

    /* 中央: 絶対配置による完全な水平センタースナップ */
    .center-ctrl-group {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      z-index: 3;
    }

    button.btn-ctrl {
      background: rgba(255, 255, 255, 0.08);
      color: #f1f5f9;
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 8px;
      padding: 6px 12px;
      font-size: 0.80rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    button.btn-ctrl:hover {
      background: rgba(255, 255, 255, 0.18);
      border-color: rgba(255, 255, 255, 0.3);
      transform: translateY(-1px);
    }

    button.btn-step {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      background: rgba(255, 255, 255, 0.06);
      padding: 6px 10px;
      font-size: 0.76rem;
      min-width: 46px;
    }

    /* 再生・一時停止 円形SVGボタン */
    button.btn-play-svg {
      background: #8b5cf6 !important;
      color: #ffffff !important;
      border: 1px solid #a78bfa !important;
      border-radius: 50% !important;
      width: 44px;
      height: 44px;
      padding: 0;
      margin: 0 4px;
      box-shadow: 0 4px 14px rgba(139, 92, 246, 0.45);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
      position: relative;
    }
    button.btn-play-svg:hover {
      background: #7c3aed !important;
      transform: scale(1.08);
      box-shadow: 0 6px 18px rgba(139, 92, 246, 0.6);
    }
    button.btn-play-svg svg {
      width: 20px;
      height: 20px;
      fill: #ffffff;
      display: block;
      margin: 0;
      padding: 0;
    }
    button.btn-play-svg.is-playing svg.icon-play {
      display: none;
    }
    button.btn-play-svg.is-playing svg.icon-pause {
      display: block;
    }
    button.btn-play-svg:not(.is-playing) svg.icon-play {
      display: block;
      transform: translateX(1px);
    }
    button.btn-play-svg:not(.is-playing) svg.icon-pause {
      display: none;
    }

    /* 右側: 座標インスペクターHUD ＆ コピーボタン */
    .right-inspector-wrap {
      display: flex;
      align-items: center;
      gap: 6px;
      z-index: 2;
    }

    .coord-inspector {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.74rem;
      color: #38bdf8;
      background: rgba(0, 0, 0, 0.45);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 6px;
      padding: 4px 10px;
      white-space: nowrap;
      text-align: right;
      user-select: text;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .coord-inspector:hover {
      border-color: rgba(56, 189, 248, 0.6);
      background: rgba(0, 0, 0, 0.6);
    }

    .btn-copy-coord {
      background: rgba(56, 189, 248, 0.2);
      color: #38bdf8;
      border: 1px solid rgba(56, 189, 248, 0.5);
      border-radius: 6px;
      padding: 4px 10px;
      font-size: 0.74rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s ease;
      white-space: nowrap;
    }
    .btn-copy-coord:hover {
      background: #38bdf8;
      color: #0f172a;
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.6);
    }

    /* コピー完了トースト通知 */
    .toast-msg {
      position: absolute;
      bottom: -34px;
      right: 12px;
      background: #38bdf8;
      color: #0f172a;
      font-weight: 800;
      font-size: 0.74rem;
      padding: 4px 12px;
      border-radius: 6px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.4);
      opacity: 0;
      pointer-events: none;
      transform: translateY(4px);
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 20;
    }
    .toast-msg.show {
      opacity: 1;
      transform: translateY(0);
    }

    /* パネル再表示ボタン */
    .btn-panel-show {
      position: absolute;
      top: 18px;
      right: 20px;
      z-index: 9;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      color: #cbd5e1;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 8px;
      padding: 6px 14px;
      font-size: 0.76rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(0,0,0,0.3);
      display: none;
      transition: all 0.15s ease;
    }
    .btn-panel-show:hover {
      background: rgba(30, 41, 59, 0.95);
      color: #ffffff;
      transform: translateY(-1px);
    }
  </style>
  <!-- 粒子マスターデータ & 楽曲 & MIDIシンセ -->
  <script src="./rag_new.js"></script>
  <script src="./rag_lyrics.js"></script>
  <script src="./lagtrain_notes.js"></script>
  <script src="./midi_synth.js"></script>
</head>
<body>
  <div id="canvas-container">
    <canvas id="main-canvas"></canvas>
  </div>

  <!-- パネル再表示用ボタン (右上) -->
  <button id="btn-panel-show" class="btn-panel-show">パネル表示 (H / Cキー)</button>

  <!-- 現代風・統合コントロールパネル (画面上部) -->
  <div class="unified-panel" id="unified-panel">
    <!-- 1. 最上段: サイト戻るリンク ＆ クレジット表示 ＆ 閉じるボタン -->
    <div class="panel-top-row">
      <div class="panel-top-left">
        <span class="hud-title">LAGTRAIN</span>
      </div>

      <!-- クレジット表記 -->
      <div class="panel-credit-wrap">
        <span class="credit-item">粒子化・音響編曲: <strong>5Gkyu</strong></span>
        <span class="credit-sep">/</span>
        <span class="credit-item">原曲: <strong>ラグトレイン (稲葉曇)</strong></span>
        <span class="credit-sep">/</span>
        <span class="credit-item">映像: <strong>ぬくぬくにぎりめし</strong></span>
        <span class="credit-sep">/</span>
        <span class="credit-item">MIDI: <strong>Latency</strong></span>
      </div>

      <button id="btn-panel-close" class="btn-panel-close" title="パネルを非表示 (H / Cキー)">閉じる</button>
    </div>

    <!-- 2. 中段: シークバー ＆ フレーム直入力ジャンプ ＆ タイム表示 -->
    <div class="timeline-row">
      <div class="seeker-wrap">
        <input type="range" id="seeker" min="0" max="251.83" step="0.0833" value="0">
      </div>

      <!-- フレーム直入力ボックス (入力してEnterで即ジャンプ) -->
      <div class="frame-jump-box" title="フレーム番号を入力してEnterで即座にジャンプ">
        <span class="frame-jump-label">F:</span>
        <input type="number" id="frame-input" class="frame-input" min="0" max="3021" value="0">
        <span class="frame-max-label">/ 3,021</span>
      </div>

      <span class="time-badge" id="time-display">00:00 / 04:11</span>
    </div>

    <!-- 3. 下段: 現代風・完全中央配置コントロール (音量 ＆ ツール | -5F -1F [再生SVG] +1F +5F | 座標インスペクター ＆ コピー) -->
    <div class="controls-row">
      <!-- 左端: 音量スライダー ＆ グリッド・範囲選択・リセットツール -->
      <div class="left-tools-wrap">
        <div class="vol-wrap">
          <span class="vol-label">音量</span>
          <input type="range" id="vol-slider" min="0" max="1" step="0.05" value="0.68">
        </div>
        <button id="btn-toggle-grid" class="btn-tool" title="グリッド線の表示/非表示 (Gキー)">グリッド</button>
        <button id="btn-toggle-box-select" class="btn-tool" title="矩形範囲選択モード (Sキー / Shift+ドラッグ)">範囲選択</button>
        <button id="btn-reset-view" class="btn-tool" title="拡大率・位置をリセット (Rキー / ダブルクリック)">リセット</button>
      </div>

      <!-- 中央: コマ戻し ＆ 再生/一時停止 SVG ボタン ＆ コマ送り (絶対配置で完全センター) -->
      <div class="center-ctrl-group">
        <button id="btn-prev-5f" class="btn-ctrl btn-step" title="5フレーム戻る (Shift+←)">-5F</button>
        <button id="btn-prev-1f" class="btn-ctrl btn-step" title="1フレーム戻る (←)">-1F</button>
        
        <button id="btn-toggle" class="btn-play-svg" title="再生 / 一時停止 (Space)">
          <svg class="icon-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
          <svg class="icon-pause" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
        </button>

        <button id="btn-next-1f" class="btn-ctrl btn-step" title="1フレーム進む (→)">+1F</button>
        <button id="btn-next-5f" class="btn-ctrl btn-step" title="5フレーム進む (Shift+→)">+5F</button>
      </div>

      <!-- 右端: 座標インスペクターHUD ＆ コピーボタン -->
      <div class="right-inspector-wrap">
        <div class="coord-inspector" id="coord-inspector" title="クリックしてコピー / テキスト選択可能">
          クリックまたはドラッグで選択
        </div>
        <button id="btn-copy-coord" class="btn-copy-coord" title="表示中の座標・範囲をクリップボードにコピー">コピー</button>
      </div>

      <div id="toast-msg" class="toast-msg">座標をコピーしました！</div>
    </div>
  </div>

  <script>
    'use strict';

    const canvas = document.getElementById('main-canvas');
    const ctx = canvas.getContext('2d', { alpha: false });

    const FPS = (window.RAG_NEW_CONFIG && window.RAG_NEW_CONFIG.fps) || 12.0;
    const TOTAL_DURATION = (window.RAG_NEW_CONFIG && window.RAG_NEW_CONFIG.duration) || 251.8333;
    const TOTAL_FRAMES = (window.RAG_NEW_CONFIG && window.RAG_NEW_CONFIG.totalFrames) || 3022;

    let isPlaying = false;
    let isSeeking = false;
    let animTime = 0;
    let lastTime = 0;
    let lastRenderedFrame = -1;

    // ズーム＆パン機能
    let zoomLevel = 1.0;
    let panX = 0;
    let panY = 0;
    let isDragging = false;
    let dragStartX = 0;
    let dragStartY = 0;
    let isGridVisible = false;

    // 範囲選択（Box Selection）機能
    let isBoxSelectMode = false;
    let isSelectingBox = false;
    let selectStartBx = 0;
    let selectStartBy = 0;
    let currentSelection = null;

    let inspectedDot = null;
    let isLockedInspector = false;
    let lastCopyText = '';

    // UI要素
    const unifiedPanel = document.getElementById('unified-panel');
    const btnPanelClose = document.getElementById('btn-panel-close');
    const btnPanelShow = document.getElementById('btn-panel-show');

    const frameInput = document.getElementById('frame-input');
    const seeker = document.getElementById('seeker');
    const timeDisplay = document.getElementById('time-display');
    const coordInspector = document.getElementById('coord-inspector');
    const btnCopyCoord = document.getElementById('btn-copy-coord');
    const toastMsg = document.getElementById('toast-msg');

    const btnToggleGrid = document.getElementById('btn-toggle-grid');
    const btnToggleBoxSelect = document.getElementById('btn-toggle-box-select');
    const btnResetView = document.getElementById('btn-reset-view');

    const btnPrev5f = document.getElementById('btn-prev-5f');
    const btnPrev1f = document.getElementById('btn-prev-1f');
    const btnNext1f = document.getElementById('btn-next-1f');
    const btnNext5f = document.getElementById('btn-next-5f');

    const btnToggle = document.getElementById('btn-toggle');
    const volSlider = document.getElementById('vol-slider');

    seeker.max = TOTAL_DURATION;

    // =========================================================================
    // トースト通知
    // =========================================================================
    let toastTimer = null;
    function showToast(text) {
      toastMsg.textContent = text;
      toastMsg.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toastMsg.classList.remove('show');
      }, 2000);
    }

    // =========================================================================
    // 確実なフォールバック付きクリップボードコピー処理
    // =========================================================================
    function copyToClipboard(text) {
      if (!text) {
        text = coordInspector.innerText.trim();
      }
      if (!text || text === 'クリックまたはドラッグで選択') {
        showToast('コピーする座標がありません');
        return;
      }

      function fallbackCopyText(str) {
        const textArea = document.createElement('textarea');
        textArea.value = str;
        textArea.style.position = 'fixed';
        textArea.style.left = '-9999px';
        textArea.style.top = '-9999px';
        textArea.style.opacity = '0';
        document.body.appendChild(textArea);
        textArea.focus();
        textArea.select();
        try {
          const success = document.execCommand('copy');
          if (success) {
            showToast('コピー完了: ' + (str.length > 28 ? str.slice(0, 28) + '...' : str));
          } else {
            showToast('コピーに失敗しました');
          }
        } catch (e) {
          showToast('コピーに失敗しました');
        }
        document.body.removeChild(textArea);
      }

      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(text).then(() => {
          showToast('コピー完了: ' + (text.length > 28 ? text.slice(0, 28) + '...' : text));
        }).catch(() => {
          fallbackCopyText(text);
        });
      } else {
        fallbackCopyText(text);
      }
    }

    btnCopyCoord.addEventListener('click', (e) => {
      e.stopPropagation();
      copyToClipboard(lastCopyText);
    });

    coordInspector.addEventListener('click', (e) => {
      e.stopPropagation();
      copyToClipboard(lastCopyText);
    });

    // =========================================================================
    // パネルの表示 / 非表示トグル (H または C キー)
    // =========================================================================
    function togglePanel(show) {
      const isHidden = (show !== undefined) ? !show : !unifiedPanel.classList.contains('hidden');
      unifiedPanel.classList.toggle('hidden', isHidden);
      btnPanelShow.style.display = isHidden ? 'block' : 'none';
    }

    btnPanelClose.addEventListener('click', () => togglePanel(false));
    btnPanelShow.addEventListener('click', () => togglePanel(true));

    // =========================================================================
    // グリッド線表示 ＆ 範囲選択モード ＆ ビューリセット
    // =========================================================================
    function toggleGrid(enable) {
      isGridVisible = (enable !== undefined) ? enable : !isGridVisible;
      btnToggleGrid.classList.toggle('active', isGridVisible);
      render();
    }

    function toggleBoxSelect(enable) {
      isBoxSelectMode = (enable !== undefined) ? enable : !isBoxSelectMode;
      btnToggleBoxSelect.classList.toggle('active', isBoxSelectMode);
      if (isBoxSelectMode) {
        showToast('範囲選択モードON (ドラッグで四角く囲む)');
      }
    }

    function resetView() {
      zoomLevel = 1.0;
      panX = 0;
      panY = 0;
      isLockedInspector = false;
      inspectedDot = null;
      currentSelection = null;
      lastCopyText = '';
      coordInspector.textContent = 'クリックまたはドラッグで選択';
      render();
    }

    btnToggleGrid.addEventListener('click', () => toggleGrid());
    btnToggleBoxSelect.addEventListener('click', () => toggleBoxSelect());
    btnResetView.addEventListener('click', resetView);

    // =========================================================================
    // ホイールによる拡大縮小（元サイズ 1.0 未満には縮小不可）
    // =========================================================================
    window.addEventListener('wheel', (e) => {
      if (e.target.closest('#unified-panel')) return;

      e.preventDefault();
      const zoomFactor = e.deltaY < 0 ? 1.18 : 0.85;
      const newZoom = Math.max(1.0, Math.min(25.0, zoomLevel * zoomFactor));

      if (newZoom === 1.0) {
        zoomLevel = 1.0;
        panX = 0;
        panY = 0;
      } else {
        const mouseX = e.clientX;
        const mouseY = e.clientY;
        const cx = canvas.width / 2;
        const cy = canvas.height / 2;

        panX = mouseX - cx - (mouseX - cx - panX) * (newZoom / zoomLevel);
        panY = mouseY - cy - (mouseY - cy - panY) * (newZoom / zoomLevel);
        zoomLevel = newZoom;
      }

      render();
    }, { passive: false });

    // =========================================================================
    // マウスドラッグ（パン移動 または 範囲矩形選択）
    // =========================================================================
    window.addEventListener('mousedown', (e) => {
      if (e.target.closest('#unified-panel') || e.target.closest('#btn-panel-show')) return;

      const isBoxMode = isBoxSelectMode || e.shiftKey;

      if (isBoxMode && e.button === 0) {
        isSelectingBox = true;
        const w = canvas.width;
        const h = canvas.height;
        const cx = w / 2 + panX;
        const cy = h / 2 + panY;
        const scale = Math.max(w / 420.0, h / 236.25) * zoomLevel;

        selectStartBx = (e.clientX - cx) / scale;
        selectStartBy = (e.clientY - cy) / scale;
        currentSelection = {
          minBx: selectStartBx, maxBx: selectStartBx,
          minBy: selectStartBy, maxBy: selectStartBy,
          count: 0
        };
      } else if (e.button === 0 || e.button === 1) {
        if (zoomLevel > 1.0) {
          isDragging = true;
          dragStartX = e.clientX - panX;
          dragStartY = e.clientY - panY;
        }
      }
    });

    window.addEventListener('mousemove', (e) => {
      if (isSelectingBox) {
        const w = canvas.width;
        const h = canvas.height;
        const cx = w / 2 + panX;
        const cy = h / 2 + panY;
        const scale = Math.max(w / 420.0, h / 236.25) * zoomLevel;

        const curBx = (e.clientX - cx) / scale;
        const curBy = (e.clientY - cy) / scale;

        const minBx = Math.min(selectStartBx, curBx);
        const maxBx = Math.max(selectStartBx, curBx);
        const minBy = Math.min(selectStartBy, curBy);
        const maxBy = Math.max(selectStartBy, curBy);

        let points = null;
        if (typeof window.generateRagNewTemplate === 'function') {
          points = window.generateRagNewTemplate(animTime, true);
        } else if (window.ragNewTmpl) {
          points = window.ragNewTmpl;
        }

        let count = 0;
        let minGx = 999, maxGx = -999, minGy = 999, maxGy = -999;

        if (points) {
          for (let i = 0; i < points.length; i++) {
            const pt = points[i];
            if (pt.bx >= minBx && pt.bx <= maxBx && pt.by >= minBy && pt.by <= maxBy) {
              count++;
              if (pt.gx !== undefined) {
                if (pt.gx < minGx) minGx = pt.gx;
                if (pt.gx > maxGx) maxGx = pt.gx;
                if (pt.gy < minGy) minGy = pt.gy;
                if (pt.gy > maxGy) maxGy = pt.gy;
              }
            }
          }
        }

        currentSelection = { minBx, maxBx, minBy, maxBy, minGx, maxGx, minGy, maxGy, count };

        const rangeStr = `bx:[<b>${minBx.toFixed(1)}〜${maxBx.toFixed(1)}</b>] by:[<b>${minBy.toFixed(1)}〜${maxBy.toFixed(1)}</b>] (${count}点)`;
        coordInspector.innerHTML = rangeStr;
        lastCopyText = `bx: ${minBx.toFixed(1)}〜${maxBx.toFixed(1)}, by: ${minBy.toFixed(1)}〜${maxBy.toFixed(1)} (gx: ${minGx}〜${maxGx}, gy: ${minGy}〜${maxGy})`;
        render();
      } else if (isDragging) {
        panX = e.clientX - dragStartX;
        panY = e.clientY - dragStartY;
        render();
      } else {
        if (!isLockedInspector && !currentSelection && !e.target.closest('#unified-panel') && !e.target.closest('#btn-panel-show')) {
          inspectAtPixel(e.clientX, e.clientY, false);
        }
      }
    });

    window.addEventListener('mouseup', (e) => {
      if (isSelectingBox) {
        isSelectingBox = false;
        if (currentSelection && (currentSelection.maxBx - currentSelection.minBx > 0.5 || currentSelection.maxBy - currentSelection.minBy > 0.5)) {
          showToast('選択完了！「コピー」ボタンで範囲をコピー');
        }
      }
      isDragging = false;
    });

    window.addEventListener('dblclick', (e) => {
      if (e.target.closest('#unified-panel')) return;
      resetView();
    });

    // =========================================================================
    // フレーム指定ジャンプ機能 (入力ボックス)
    // =========================================================================
    function jumpToFrame(targetFrame) {
      if (isPlaying) {
        togglePlay();
      }
      const safeFrame = Math.max(0, Math.min(TOTAL_FRAMES - 1, Math.floor(targetFrame)));
      animTime = (safeFrame + 0.001) / FPS;
      if (window.lagtrainSynth) {
        window.lagtrainSynth.seek(animTime);
      }
      lastRenderedFrame = -1;
      render();
    }

    frameInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        jumpToFrame(parseInt(frameInput.value, 10) || 0);
        frameInput.blur();
      }
      e.stopPropagation();
    });

    frameInput.addEventListener('change', () => {
      jumpToFrame(parseInt(frameInput.value, 10) || 0);
    });

    // =========================================================================
    // 1F / 5F コマ送り・コマ戻し処理
    // =========================================================================
    function stepFrames(deltaFrames) {
      if (isPlaying) {
        togglePlay();
      }
      const curFrame = Math.floor(animTime * FPS);
      jumpToFrame(curFrame + deltaFrames);
    }

    btnPrev5f.addEventListener('click', () => stepFrames(-5));
    btnPrev1f.addEventListener('click', () => stepFrames(-1));
    btnNext1f.addEventListener('click', () => stepFrames(1));
    btnNext5f.addEventListener('click', () => stepFrames(5));

    // =========================================================================
    // 単一ドット座標インスペクター
    // =========================================================================
    function inspectAtPixel(clientX, clientY, isClick = false) {
      const w = canvas.width;
      const h = canvas.height;
      if (w === 0 || h === 0) return;

      const cx = w / 2 + panX;
      const cy = h / 2 + panY;
      const baseScale = Math.max(w / 420.0, h / 236.25);
      const scale = baseScale * zoomLevel;

      const clickBx = (clientX - cx) / scale;
      const clickBy = (clientY - cy) / scale;

      let points = null;
      if (typeof window.generateRagNewTemplate === 'function') {
        points = window.generateRagNewTemplate(animTime, true);
      } else if (window.ragNewTmpl) {
        points = window.ragNewTmpl;
      }

      if (points && points.length > 0) {
        let nearest = null;
        let minDistSq = 999999;

        for (let i = 0; i < points.length; i++) {
          const pt = points[i];
          const dx = pt.bx - clickBx;
          const dy = pt.by - clickBy;
          const distSq = dx * dx + dy * dy;
          if (distSq < minDistSq) {
            minDistSq = distSq;
            nearest = pt;
          }
        }

        const maxThreshold = Math.max(16.0, 16.0 / zoomLevel);
        if (nearest && Math.sqrt(minDistSq) < maxThreshold) {
          inspectedDot = nearest;
          const valName = nearest.val === 1 ? '黒' : (nearest.val === 2 ? '白' : '灰');
          const lockTag = isClick ? '[固定] ' : '';
          coordInspector.innerHTML = `${lockTag}bx:<b>${nearest.bx.toFixed(1)}</b> by:<b>${nearest.by.toFixed(1)}</b> | gx:<b>${nearest.gx || '-'}</b> gy:<b>${nearest.gy || '-'}</b> (${valName})`;
          lastCopyText = `bx: ${nearest.bx.toFixed(1)}, by: ${nearest.by.toFixed(1)}, gx: ${nearest.gx || '-'}, gy: ${nearest.gy || '-'}, val: ${nearest.val}`;
          coordInspector.style.color = '#38bdf8';
        } else {
          inspectedDot = { bx: clickBx, by: clickBy, val: 0 };
          const lockTag = isClick ? '[固定] ' : '';
          coordInspector.innerHTML = `${lockTag}bx:<b>${clickBx.toFixed(1)}</b> by:<b>${clickBy.toFixed(1)}</b> (空間)`;
          lastCopyText = `bx: ${clickBx.toFixed(1)}, by: ${clickBy.toFixed(1)}`;
          coordInspector.style.color = '#94a3b8';
        }
      }
      render();
    }

    window.addEventListener('click', (e) => {
      if (e.target.closest('#unified-panel') || e.target.closest('#btn-panel-show')) return;
      if (isBoxSelectMode || e.shiftKey) return;
      currentSelection = null;
      isLockedInspector = true;
      inspectAtPixel(e.clientX, e.clientY, true);
    });

    window.addEventListener('contextmenu', (e) => {
      isLockedInspector = false;
      inspectedDot = null;
      currentSelection = null;
      lastCopyText = '';
      coordInspector.textContent = `クリックまたはドラッグで選択`;
      render();
    });

    // =========================================================================
    // リサイズ処理
    // =========================================================================
    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      lastRenderedFrame = -1;
      render();
    }
    window.addEventListener('resize', resizeCanvas);

    // =========================================================================
    // 描画エンジン (ズーム＆パン＆グリッド線＆範囲選択枠描画)
    // =========================================================================
    function render() {
      const w = canvas.width;
      const h = canvas.height;
      if (w === 0 || h === 0) return;

      ctx.fillStyle = '#b2b2b2';
      ctx.fillRect(0, 0, w, h);

      const cx = w / 2 + panX;
      const cy = h / 2 + panY;
      const baseScale = Math.max(w / 420.0, h / 236.25);
      const scale = baseScale * zoomLevel;

      let points = null;
      if (typeof window.generateRagNewTemplate === 'function') {
        points = window.generateRagNewTemplate(animTime, true);
      } else if (window.ragNewTmpl) {
        points = window.ragNewTmpl;
      }

      if (points && points.length > 0) {
        ctx.fillStyle = '#000000';
        for (let i = 0; i < points.length; i++) {
          const pt = points[i];
          if (pt.rgb[0] === 0) {
            const px = Math.floor(cx + (pt.bx - pt.size * 0.5) * scale);
            const py = Math.floor(cy + (pt.by - pt.size * 0.5) * scale);
            const sz = Math.ceil(pt.size * scale + 0.6);
            ctx.fillRect(px, py, sz, sz);
          }
        }

        ctx.fillStyle = '#ffffff';
        for (let i = 0; i < points.length; i++) {
          const pt = points[i];
          if (pt.rgb[0] === 255) {
            const px = Math.floor(cx + (pt.bx - pt.size * 0.5) * scale);
            const py = Math.floor(cy + (pt.by - pt.size * 0.5) * scale);
            const sz = Math.ceil(pt.size * scale + 0.6);
            ctx.fillRect(px, py, sz, sz);
          }
        }

        if (isGridVisible) {
          ctx.lineWidth = 1.0;
          for (let i = 0; i < points.length; i++) {
            const pt = points[i];
            const px = Math.floor(cx + (pt.bx - pt.size * 0.5) * scale);
            const py = Math.floor(cy + (pt.by - pt.size * 0.5) * scale);
            const sz = Math.ceil(pt.size * scale + 0.6);

            if (pt.rgb[0] === 0) {
              ctx.strokeStyle = 'rgba(56, 189, 248, 0.45)';
            } else if (pt.rgb[0] === 255) {
              ctx.strokeStyle = 'rgba(0, 0, 0, 0.35)';
            } else {
              ctx.strokeStyle = 'rgba(255, 255, 255, 0.35)';
            }
            ctx.strokeRect(px, py, sz, sz);
          }
        }
      }

      // 範囲選択ボックス
      if (currentSelection && (currentSelection.maxBx - currentSelection.minBx > 0.1 || currentSelection.maxBy - currentSelection.minBy > 0.1)) {
        const sx = cx + currentSelection.minBx * scale;
        const sy = cy + currentSelection.minBy * scale;
        const sw = (currentSelection.maxBx - currentSelection.minBx) * scale;
        const sh = (currentSelection.maxBy - currentSelection.minBy) * scale;

        ctx.fillStyle = 'rgba(56, 189, 248, 0.18)';
        ctx.fillRect(sx, sy, sw, sh);
        ctx.strokeStyle = '#38bdf8';
        ctx.lineWidth = 2.0;
        ctx.strokeRect(sx, sy, sw, sh);
      }

      // 単一ドットマーカー
      if (inspectedDot && !currentSelection) {
        const mx = cx + inspectedDot.bx * scale;
        const my = cy + inspectedDot.by * scale;
        ctx.strokeStyle = '#38bdf8';
        ctx.lineWidth = 2.0;
        ctx.strokeRect(mx - 8, my - 8, 16, 16);

        ctx.beginPath();
        ctx.moveTo(mx - 14, my);
        ctx.lineTo(mx + 14, my);
        ctx.moveTo(mx, my - 14);
        ctx.lineTo(mx, my + 14);
        ctx.stroke();
      }

      updateUI();
    }

    // =========================================================================
    // UI更新
    // =========================================================================
    function formatTime(sec) {
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60);
      return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
    }

    function updateUI() {
      const curFrame = Math.min(TOTAL_FRAMES - 1, Math.floor(animTime * FPS));

      if (document.activeElement !== frameInput) {
        frameInput.value = curFrame;
      }
      timeDisplay.textContent = `${formatTime(animTime)} / ${formatTime(TOTAL_DURATION)}`;

      if (!isSeeking) {
        seeker.value = animTime;
      }
    }

    // =========================================================================
    // アニメーション ＆ シンセループ
    // =========================================================================
    function loop(now) {
      if (!lastTime) lastTime = now;
      const delta = Math.min((now - lastTime) / 1000, 0.1);
      lastTime = now;

      if (isPlaying) {
        animTime += delta;
        if (animTime >= TOTAL_DURATION) {
          animTime = animTime % TOTAL_DURATION;
          if (window.lagtrainSynth) window.lagtrainSynth.seek(animTime);
        }

        const curFrame = Math.min(TOTAL_FRAMES - 1, Math.floor(animTime * FPS));
        if (curFrame !== lastRenderedFrame) {
          lastRenderedFrame = curFrame;
          render();
        }

        if (window.lagtrainSynth) {
          window.lagtrainSynth.update(animTime, isPlaying);
        }
      }

      requestAnimationFrame(loop);
    }

    // =========================================================================
    // コントロールイベント
    // =========================================================================
    function togglePlay() {
      isPlaying = !isPlaying;
      btnToggle.classList.toggle('is-playing', isPlaying);

      if (isPlaying) {
        lastTime = performance.now();
        if (window.lagtrainSynth) {
          if (!window.lagtrainSynth.ctx) {
            window.lagtrainSynth.init();
          }
          if (window.lagtrainSynth.ctx && window.lagtrainSynth.ctx.state === 'suspended') {
            window.lagtrainSynth.ctx.resume();
          }
          window.lagtrainSynth.seek(animTime);
        }
      } else {
        if (window.lagtrainSynth) {
          window.lagtrainSynth.stopAll();
        }
      }
    }

    btnToggle.addEventListener('click', togglePlay);

    window.addEventListener('click', () => {
      if (window.lagtrainSynth && window.lagtrainSynth.ctx && window.lagtrainSynth.ctx.state === 'suspended') {
        window.lagtrainSynth.ctx.resume();
      }
    }, { once: true });

    // シークバー
    seeker.addEventListener('input', () => {
      isSeeking = true;
      animTime = parseFloat(seeker.value);
      lastRenderedFrame = -1;
      render();
    });

    seeker.addEventListener('change', () => {
      isSeeking = false;
      animTime = parseFloat(seeker.value);
      if (window.lagtrainSynth) {
        window.lagtrainSynth.seek(animTime);
      }
      lastRenderedFrame = -1;
      render();
    });

    // 音量スライダー
    volSlider.addEventListener('input', () => {
      const vol = parseFloat(volSlider.value);
      if (window.lagtrainSynth) window.lagtrainSynth.setVolume(vol);
    });

    // キーボードショートカット
    window.addEventListener('keydown', (e) => {
      if (e.target === frameInput) return;

      if (e.code === 'Space') {
        e.preventDefault();
        togglePlay();
      } else if (e.code === 'KeyH' || e.code === 'KeyC') {
        togglePanel();
      } else if (e.code === 'KeyG') {
        toggleGrid();
      } else if (e.code === 'KeyS') {
        toggleBoxSelect();
      } else if (e.code === 'KeyR') {
        resetView();
      } else if (e.code === 'ArrowLeft') {
        e.preventDefault();
        stepFrames(e.shiftKey ? -5 : -1);
      } else if (e.code === 'ArrowRight') {
        e.preventDefault();
        stepFrames(e.shiftKey ? 5 : 1);
      }
    });

    resizeCanvas();
    render();
    requestAnimationFrame(loop);
  </script>
</body>
</html>
