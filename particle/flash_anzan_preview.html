<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Flash Anzan (フラッシュ暗算) - Particle Animation Preview</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      background-color: #060812;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    #canvas-container {
      position: absolute;
      inset: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at center, #0c1228 0%, #050711 100%);
      z-index: 1;
    }
    canvas {
      display: block;
      width: 100% !important;
      height: 100% !important;
    }
    .hud-overlay {
      position: absolute;
      top: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      pointer-events: none;
      text-align: center;
    }
    .hud-title {
      font-size: 1.4rem;
      font-weight: 800;
      letter-spacing: 0.12em;
      background: linear-gradient(135deg, #00f0ff, #ffdd44, #ff5588);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 20px rgba(0, 240, 255, 0.4);
    }
    .hud-badge {
      font-size: 0.8rem;
      color: #94a3b8;
      letter-spacing: 0.08em;
    }
    .controls {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      display: flex;
      gap: 12px;
    }
    .btn {
      background: rgba(15, 23, 42, 0.75);
      border: 1px solid rgba(0, 240, 255, 0.35);
      color: #e2e8f0;
      padding: 8px 18px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      backdrop-filter: blur(8px);
      transition: all 0.2s ease;
    }
    .btn:hover {
      background: rgba(0, 240, 255, 0.2);
      border-color: #00f0ff;
      transform: translateY(-2px);
    }
  </style>
</head>
<body>
  <div class="hud-overlay">
    <div class="hud-title">⚡ FLASH MENTAL ARITHMETIC ⚡</div>
    <div class="hud-badge">0.8s INTERVAL × 5 NUMBERS • PARTICLE SIMULATION</div>
  </div>

  <div id="canvas-container">
    <canvas id="mainCanvas"></canvas>
  </div>

  <div class="controls">
    <button class="btn" id="btnRestart">↺ リスタート</button>
    <button class="btn" id="btnSpeed05">0.5x 速度</button>
    <button class="btn" id="btnSpeed1">1.0x 標準</button>
    <button class="btn" id="btnSpeed15">1.5x 高速</button>
  </div>

  <script src="./flash_anzan.js"></script>
  <script>
    const canvas = document.getElementById('mainCanvas');
    const ctx = canvas.getContext('2d', { alpha: false });

    let width = window.innerWidth;
    let height = window.innerHeight;
    let dpr = Math.min(window.devicePixelRatio || 1, 2);

    function resize() {
      width = window.innerWidth;
      height = window.innerHeight;
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = width * dpr;
      canvas.height = height * dpr;
      ctx.scale(dpr, dpr);
    }
    window.addEventListener('resize', resize);
    resize();

    let startTime = performance.now();
    let speedMult = 1.0;
    let manualOffset = 0;

    document.getElementById('btnRestart').addEventListener('click', () => {
      startTime = performance.now();
      manualOffset = 0;
    });
    document.getElementById('btnSpeed05').addEventListener('click', () => speedMult = 0.5);
    document.getElementById('btnSpeed1').addEventListener('click', () => speedMult = 1.0);
    document.getElementById('btnSpeed15').addEventListener('click', () => speedMult = 1.5);

    // 粒子補間用バッファ
    const MAX_PTS = 3600;
    const posX = new Float32Array(MAX_PTS);
    const posY = new Float32Array(MAX_PTS);
    let initialized = false;

    function render() {
      const now = performance.now();
      const elapsed = ((now - startTime) * 0.001 * speedMult) + manualOffset;

      const tmpl = generateFlashAnzanTemplate(elapsed);
      const cx = width * 0.5;
      const cy = height * 0.52;
      const scale = Math.min(width / 540, height / 440) * 1.35;

      // 残像ブラック
      ctx.fillStyle = '#060814';
      ctx.fillRect(0, 0, width, height);

      // パーティクル即座直接描画（数字の切り替えを瞬時にくっきり表示）
      for (let i = 0; i < tmpl.length; i++) {
        const px = cx + tmpl[i].bx * scale;
        const py = cy + tmpl[i].by * scale;
        const rgb = tmpl[i].rgb;
        const sz = (tmpl[i].size || 2.0) * Math.max(0.8, scale * 0.75);

        ctx.fillStyle = `rgb(${rgb[0]}, ${rgb[1]}, ${rgb[2]})`;
        ctx.fillRect(px - sz * 0.5, py - sz * 0.5, sz, sz);
      }

      requestAnimationFrame(render);
    }
    requestAnimationFrame(render);
  </script>
</body>
</html>
