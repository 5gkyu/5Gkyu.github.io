<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Halcyon ブックマークレットランチャー</title>
  <link rel="stylesheet" href="popup.css">
</head>

<body>
  <div class="launcher-container">
    <!-- ヘッダー -->
    <header class="launcher-header">
      <div class="header-main">
        <div class="brand">
          <img src="icons/icon48.png" alt="Logo" class="brand-logo">
          <div class="brand-titles">
            <h1 class="brand-name">Halcyon Launcher</h1>
            <span class="sync-status" id="syncStatus">GitHubと同期中...</span>
          </div>
        </div>
        <div class="header-actions">
          <span class="count-badge" id="countBadge">0件</span>
          <button class="btn-icon" id="btnSync" title="GitHubから最新データを再取得">
            <svg class="sync-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67" />
            </svg>
          </button>
        </div>
      </div>

      <!-- 検索バー -->
      <div class="search-box">
        <span class="search-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
            <circle cx="11" cy="11" r="8" />
            <line x1="21" y1="21" x2="16.65" y2="16.65" />
          </svg>
        </span>
        <input type="search" id="searchInput" placeholder="ブックマークレットを検索..." autocomplete="off" spellcheck="false">
        <button id="searchClear" class="search-clear" title="検索をクリア" aria-label="検索をクリア">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
            <line x1="18" y1="6" x2="6" y2="18" />
            <line x1="6" y1="6" x2="18" y2="18" />
          </svg>
        </button>
      </div>

    </header>

    <!-- ブックマークレット一覧 -->
    <main class="launcher-list-wrap" id="listWrap">
      <div class="launcher-list" id="cardList"></div>
      <div class="empty-state" id="emptyState" hidden>
        <p class="empty-title">見つかりませんでした</p>
        <p class="empty-desc">別のキーワードをお試しください</p>
      </div>
    </main>

    <!-- トースト通知 -->
    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <!-- フッター -->
    <footer class="launcher-footer">
      <div class="footer-shortcut">
        <kbd>Alt</kbd>+<kbd>X</kbd> で即起動
      </div>
      <a href="https://5gkyu.github.io/archive/other/booklet/" target="_blank" class="footer-link" title="Webサイトを開く">
        Web一覧 <span>&nearr;</span>
      </a>
    </footer>
  </div>

  <script src="actions.js"></script>
  <script src="popup.js"></script>
</body>

</html>
